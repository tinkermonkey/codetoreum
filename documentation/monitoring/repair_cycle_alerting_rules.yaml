# Prometheus alerting rules for repair cycle monitoring
# Save to: /etc/prometheus/rules/repair_cycle_alerts.yml

groups:
  - name: repair_cycle_alerts
    interval: 30s
    rules:
      # ========================================================================
      # Success Rate Alerts
      # ========================================================================

      - alert: RepairCycleSuccessRateLow
        expr: |
          (
            increase(codetoreum_repair_cycle_successful_total[1h]) /
            increase(codetoreum_repair_cycle_completed_total[1h])
          ) < 0.7
        for: 10m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "Repair cycle success rate is below 70%"
          description: |
            Repair cycle success rate has dropped below 70% in the last hour.
            Current rate: {{ $value | humanizePercentage }}
            Cluster: {{ $labels.cluster }}

      - alert: RepairCycleCriticalFailureRate
        expr: |
          (
            increase(codetoreum_repair_cycle_successful_total[30m]) /
            increase(codetoreum_repair_cycle_completed_total[30m])
          ) < 0.5
        for: 5m
        labels:
          severity: critical
          service: repair_cycle
        annotations:
          summary: "Repair cycle success rate critically low (< 50%)"
          description: |
            Repair cycle success rate has dropped below 50% in the last 30 minutes.
            Current rate: {{ $value | humanizePercentage }}
            Action Required: Investigate agent failures and test suite issues.

      # ========================================================================
      # Performance/Duration Alerts
      # ========================================================================

      - alert: RepairCycleDurationHigh
        expr: |
          histogram_quantile(0.95,
            rate(codetoreum_repair_cycle_duration_seconds_bucket[5m])
          ) > 600
        for: 10m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "Repair cycle duration exceeds 10 minutes (p95)"
          description: |
            95th percentile repair cycle duration has exceeded 10 minutes.
            P95 Duration: {{ $value | humanizeDuration }}
            Status: {{ $labels.status }}
            This may indicate performance degradation or complex failures requiring many fix attempts.

      - alert: RepairCycleDurationCritical
        expr: |
          histogram_quantile(0.99,
            rate(codetoreum_repair_cycle_duration_seconds_bucket[5m])
          ) > 1200
        for: 5m
        labels:
          severity: critical
          service: repair_cycle
        annotations:
          summary: "Repair cycle duration critically high (> 20 minutes)"
          description: |
            99th percentile repair cycle duration has exceeded 20 minutes.
            P99 Duration: {{ $value | humanizeDuration }}
            Status: {{ $labels.status }}
            Action Required: Investigate performance bottlenecks and timeout configurations.

      # ========================================================================
      # Test Execution Alerts
      # ========================================================================

      - alert: TestExecutionFailureRate
        expr: |
          (
            increase(codetoreum_repair_cycle_test_failures_total[1h]) /
            increase(codetoreum_repair_cycle_test_executions_total[1h])
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "Test failure rate is over 50%"
          description: |
            More than 50% of test executions are failing in {{ $labels.test_type }} tests.
            Failure Rate: {{ $value | humanizePercentage }}
            Action Required: Review test suite configuration and agent fix logic.

      - alert: TestExecutionTimeout
        expr: |
          histogram_quantile(0.99,
            rate(codetoreum_repair_cycle_test_execution_duration_seconds_bucket[5m])
          ) > 300
        for: 5m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "Test execution timeout detected"
          description: |
            {{ $labels.test_type }} test execution is timing out (> 5 minutes).
            P99 Duration: {{ $value | humanizeDuration }}
            Consider: Increasing timeout thresholds or investigating hanging tests.

      # ========================================================================
      # Fast-Fail Alerts
      # ========================================================================

      - alert: RepairCycleFastFailDetected
        expr: |
          increase(codetoreum_repair_cycle_fast_failed_total[30m]) > 5
        for: 5m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "Multiple repair cycle fast-fails detected"
          description: |
            {{ $value }} fast-fail events occurred in the last 30 minutes.
            Reason: {{ $labels.reason }}
            Action Required: Investigate circuit breaker triggers and max iteration limits.

      - alert: MaxIterationsExceeded
        expr: |
          increase(codetoreum_repair_cycle_fast_failed_total{reason="max_iterations_exceeded"}[1h]) > 10
        for: 5m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "Max iterations exceeded frequently"
          description: |
            {{ $value }} cycles exceeded max iterations in the last hour.
            Consider: Increasing max_iterations or investigating agent effectiveness.

      - alert: MaxAgentCallsExceeded
        expr: |
          increase(codetoreum_repair_cycle_fast_failed_total{reason="max_agent_calls_exceeded"}[1h]) > 5
        for: 5m
        labels:
          severity: critical
          service: repair_cycle
        annotations:
          summary: "Agent call limits being exceeded"
          description: |
            {{ $value }} cycles hit max agent calls in the last hour.
            Action Required: Review repair_cycle configuration and agent efficiency.

      # ========================================================================
      # File Fix Alerts
      # ========================================================================

      - alert: FileFixDurationHigh
        expr: |
          histogram_quantile(0.95,
            rate(codetoreum_repair_cycle_file_fix_duration_seconds_bucket[5m])
          ) > 120
        for: 10m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "File fix duration exceeds 2 minutes (p95)"
          description: |
            95th percentile file fix duration for {{ $labels.file_extension }} exceeds 2 minutes.
            P95 Duration: {{ $value | humanizeDuration }}
            Action Required: Investigate file complexity and agent response times.

      - alert: FilesFixedDropped
        expr: |
          (
            increase(codetoreum_repair_cycle_files_fixed_total[1h]) /
            (increase(codetoreum_repair_cycle_completed_total[1h]) + 0.001)
          ) < 0.5
        for: 15m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "File fix success rate is low"
          description: |
            Average files fixed per cycle is less than 0.5.
            Fix Rate: {{ $value }} files/cycle
            This may indicate ineffective fix attempts or test logic issues.

      # ========================================================================
      # Agent Performance Alerts
      # ========================================================================

      - alert: HighAgentCallsPerCycle
        expr: |
          increase(codetoreum_repair_cycle_agent_calls_per_cycle[5m]) > 10
        for: 10m
        labels:
          severity: warning
          service: repair_cycle
          agent: "{{ $labels.agent_name }}"
        annotations:
          summary: "Agent {{ $labels.agent_name }} requires many calls per cycle"
          description: |
            Agent {{ $labels.agent_name }} is averaging {{ $value }} calls per cycle.
            This may indicate ineffective fixes or poor failure analysis.
            Action Required: Review agent prompts and fix generation logic.

      - alert: AgentSuccessRateLow
        expr: |
          (
            increase(codetoreum_repair_cycle_successful_total[1h]) /
            (increase(codetoreum_repair_cycle_completed_total[1h]) + 0.001)
          ) < 0.6
        for: 15m
        labels:
          severity: warning
          service: repair_cycle
          agent: "{{ $labels.agent_name }}"
        annotations:
          summary: "Agent {{ $labels.agent_name }} success rate is below 60%"
          description: |
            Agent {{ $labels.agent_name }} success rate: {{ $value | humanizePercentage }}
            Action Required: Review agent configuration and failure logs.

      # ========================================================================
      # Active Cycle Alerts
      # ========================================================================

      - alert: HighNumberOfActiveCycles
        expr: |
          sum(codetoreum_repair_cycle_active_count) > 20
        for: 10m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "More than 20 active repair cycles"
          description: |
            Currently {{ $value }} repair cycles are running.
            Consider: Scaling up resources or reducing concurrent cycle limits.

      - alert: StuckRepairCycle
        expr: |
          codetoreum_repair_cycle_active_count > 0
          and
          time() - max(codetoreum_repair_cycle_completed_total) > 3600
        for: 30m
        labels:
          severity: critical
          service: repair_cycle
        annotations:
          summary: "Repair cycles appear to be stuck"
          description: |
            {{ $value }} cycles have been active for over 30 minutes.
            Last completion: {{ humanize(time() - max(codetoreum_repair_cycle_completed_total)) }} ago
            Action Required: Check logs and consider manual restart.

      # ========================================================================
      # Warning Review Alerts
      # ========================================================================

      - alert: HighWarningReviewLoad
        expr: |
          increase(codetoreum_repair_cycle_warnings_reviewed_total[1h]) > 100
        for: 10m
        labels:
          severity: info
          service: repair_cycle
        annotations:
          summary: "High volume of warnings being reviewed"
          description: |
            {{ $value }} warnings reviewed in the last hour.
            Severity breakdown: {{ $labels.severity }}
            Monitor: This may indicate test quality issues.

      # ========================================================================
      # Infrastructure Alerts
      # ========================================================================

      - alert: RepairCycleMetricsUnavailable
        expr: |
          up{job="repair_cycle_metrics"} == 0
        for: 5m
        labels:
          severity: critical
          service: repair_cycle
        annotations:
          summary: "Repair cycle metrics are unavailable"
          description: |
            Repair cycle metrics endpoint is not responding.
            Action Required: Check metrics service health and logs.

      - alert: RepairCycleMetricsStale
        expr: |
          time() - max(increase(codetoreum_repair_cycle_completed_total[5m])) > 600
          and
          increase(codetoreum_repair_cycle_started_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
          service: repair_cycle
        annotations:
          summary: "Repair cycle metrics appear stale"
          description: |
            No metric updates in the last 10 minutes despite active cycles.
            Action Required: Verify metrics pipeline and event bus connectivity.
