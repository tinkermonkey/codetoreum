[tool.poetry]
name = "codetoreum"
version = "0.1.0"
description = "AI Agent Orchestration Platform for automating software development workflows"
authors = ["Codetoreum Team"]
readme = "README.md"
packages = [{include = "codetoreum", from = "src"}]

[tool.poetry.scripts]
codetoreum = "codetoreum.cli.main:cli"
codetoreum-server = "codetoreum.cli.production_server:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
redis = "^5.2.0"
elasticsearch = "^8.0.0"
docker = "^7.1.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
httpx = "^0.27.2"
aiohttp = "^3.9.0"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.2"
jinja2 = "^3.1.4"
asyncio = "^3.4.3"
aiofiles = "^24.1.0"
typer = "^0.12.0"
rich = "^13.7.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
email-validator = "^2.1.0"
opentelemetry-api = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-exporter-otlp-proto-grpc = "^1.39.1"
opentelemetry-instrumentation-fastapi = "^0.60b1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.2.0"
pytest-xdist = "^3.5.0"
ruff = "^0.15.2"
black = "^26.1.0"
mypy = "^1.19.1"
pre-commit = "^4.5.1"
testcontainers = "^4.8.2"
slowapi = "^0.1.9"
types-python-dateutil = "^2.9.0.20260124"
types-requests = "^2.32.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.44"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ===== Black Configuration =====
[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ===== Ruff Configuration =====
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ",  # flake8-django
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]
ignore = [
    # Formatter compatibility
    "COM812", # Missing trailing comma (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)
    "E501",   # Line too long (ruff-format handles code lines; string literals/comments are exempt)

    # Logging: project uses f-strings and exc_info=True intentionally throughout
    "G003",   # logging-string-concat
    "G004",   # logging-f-string
    "G201",   # logging-exc-info

    # Private member access: intentional in adapter/testing patterns
    "SLF001", # private-member-access

    # Lazy imports: hexagonal architecture uses deferred imports intentionally
    "PLC0415", # import-outside-top-level

    # Interface implementations: unused args are common when matching port signatures
    "ARG001", # unused-function-argument
    "ARG002", # unused-method-argument
    "ARG003", # unused-class-method-argument
    "ARG004", # unused-static-method-argument

    # FastAPI: Depends() in default args is idiomatic
    "B008",   # function-call-in-default-argument

    # HTTP exception handling: broad catches to convert to HTTP errors are intentional
    "BLE001", # blind-except
    "B904",   # raise-without-from-inside-except

    # Try/except style preferences
    "TRY002", # raise-vanilla-class
    "TRY003", # avoid-specifying-long-messages-outside-exception-class
    "TRY004", # type-check-without-type-error
    "TRY203", # useless-try-except
    "TRY300", # try-consider-else
    "TRY301", # raise-within-try
    "TRY400", # error-instead-of-exception
    "TRY401", # verbose-log-message

    # Exception message style preferences
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception

    # Type annotations: not consistently enforced in this codebase
    "ANN001", # missing-type-function-argument
    "ANN002", # missing-type-args
    "ANN003", # missing-type-kwargs
    "ANN201", # missing-return-type-undocumented-public-function
    "ANN202", # missing-return-type-private-function
    "ANN204", # missing-return-type-special-method
    "ANN205", # missing-return-type-static-method
    "ANN401", # any-type

    # Commented-out code: too aggressive, intentional examples exist
    "ERA001", # commented-out-code

    # Type-ignore comments: sometimes necessary for third-party stubs
    "PGH003", # blanket-type-ignore

    # Code simplification: style preferences
    "RET504", # unnecessary-assign
    "SIM102", # collapsible-if
    "SIM103", # needless-bool
    "SIM105", # suppressible-exception
    "SIM108", # if-else-block-instead-of-if-exp
    "SIM110", # reimplemented-builtin
    "SIM117", # multiple-with-statements
    "SIM118", # in-dict-keys

    # Complexity limits: would require significant refactoring
    "C901",    # complex-structure
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements

    # Magic values: too many false positives with HTTP status codes and limits
    "PLR2004", # magic-value-comparison

    # Import positioning: conditional/deferred imports sometimes unavoidable
    "E402",   # module-import-not-at-top-of-file

    # Naming: existing conventions in the codebase
    "N801",   # invalid-class-name
    "N803",   # invalid-argument-name
    "N806",   # non-lowercase-variable-in-function
    "N815",   # mixed-case-variable-in-class-scope
    "N818",   # error-suffix-on-exception-name

    # Namespace packages: scripts directory does not need __init__
    "INP001", # implicit-namespace-package

    # Relative imports: used in SDK generated code
    "TID252", # relative-imports

    # Security: false positives on test values and common patterns
    "S101",   # assert (acceptable in tests)
    "S104",   # hardcoded-bind-all-interfaces
    "S106",   # hardcoded-password-func-arg (FP on param names)
    "S108",   # hardcoded-temp-file (/tmp in tests/utilities)
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    "S202",   # tarfile-unsafe-members
    "S311",   # suspicious-non-cryptographic-random-usage
    "S603",   # subprocess-without-shell-equals-true
    "S608",   # hardcoded-sql-expression

    # Async: blocking calls are sometimes intentional in utility code
    "ASYNC109", # async-function-with-timeout
    "ASYNC221", # run-process-in-async-function
    "ASYNC230", # blocking-open-call-in-async-function
    "ASYNC240", # blocking-path-method-in-async-function

    # Type-checking imports: can cause runtime issues if moved
    "TC001",  # typing-only-first-party-import
    "TC002",  # typing-only-third-party-import
    "TC003",  # typing-only-standard-library-import

    # Print statements: acceptable in utility scripts
    "T201",   # print

    # Pylint misc
    "PLW0603", # global-statement
    "PLW0108", # unnecessary-lambda
    "PLW2901", # redefined-loop-name
    "PLR1714", # repeated-equality-comparison

    # Pathlib: os.path still used throughout codebase
    "PTH108", # os-unlink
    "PTH110", # os-path-exists
    "PTH118", # os-path-join
    "PTH123", # builtin-open

    # Ruff-specific style
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF005", # collection-literal-concatenation
    "RUF006", # asyncio-dangling-task
    "RUF012", # mutable-class-default
    "RUF015", # unnecessary-iterable-allocation-for-first-element
    "RUF022", # unsorted-dunder-all
    "RUF034", # useless-if-else
    "RUF043", # pytest-raises-ambiguous-pattern
    "RUF059", # unused-unpacked-variable

    # Datetime: timezone-naive datetimes used intentionally in some places
    "DTZ001", # call-datetime-without-tzinfo
    "DTZ005", # call-datetime-now-without-tzinfo
    "DTZ006", # call-datetime-fromtimestamp
    "DTZ901", # datetime-min-max

    # Builtin shadowing: sometimes intentional
    "A001",   # builtin-variable-shadowing
    "A002",   # builtin-argument-shadowing
    "A004",   # builtin-import-shadowing

    # Misc style
    "B007",   # unused-loop-control-variable
    "B011",   # assert-false
    "B017",   # assert-raises-exception
    "B026",   # star-arg-unpacking-after-keyword-arg
    "C401",   # unnecessary-generator-set
    "C414",   # unnecessary-double-cast-or-process
    "C416",   # unnecessary-comprehension
    "PIE810", # multiple-starts-ends-with
    "PLC0206", # dict-index-missing-items
    "RSE102", # unnecessary-paren-on-raise-exception

    # Stub file rules (stubs have different conventions)
    "PYI021", # docstring-in-stub
    "PYI034", # non-self-return-type
    "PYI036", # bad-exit-annotation

    # Executable
    "EXE001", # shebang-not-executable

    # str-enum replacement (potentially breaking change)
    "UP042",  # replace-str-enum

    # pytest style: varied patterns used across test suite
    "PT003",  # pytest-extraneous-scope-function
    "PT006",  # pytest-parametrize-names-wrong-type
    "PT011",  # pytest-raises-too-broad
    "PT012",  # pytest-raises-with-multiple-statements
    "PT015",  # pytest-assert-always-false
    "PT017",  # pytest-assert-in-except
    "PT018",  # pytest-composite-assertion
    "PT031",  # pytest-warns-with-multiple-statements

    # Security: constants/identifiers containing "token", "password", "secret" in their name
    "S105",   # hardcoded-password-string (FP on error code names and constant identifiers)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "ARG",     # Unused function args allowed in tests
    "PLR2004", # Magic value used in comparison
    "ANN",     # Type annotations not required in all tests
    "F841",    # Unused variables common in test setup/teardown
    "F401",    # Unused imports (opentelemetry side-effect imports in tests)
    "PLE1205", # Custom logger subclasses have different signatures than stdlib logging
]
"tests/integration/adapters/secondary/test_webhook_validation.py" = [
    "S324",    # Insecure hash function SHA1 (intentionally tests SHA-1 rejection)
]
"src/codetoreum/adapters/secondary/docker_container_recovery_adapter.py" = [
    "F821",    # String annotations with lazy imports: valid pattern, resolved by mypy
]
"src/codetoreum/adapters/testing/mock_board_adapter.py" = [
    "F821",    # String annotations with lazy imports: valid pattern, resolved by mypy
]
"src/codetoreum/adapters/testing/mock_container_recovery_adapter.py" = [
    "F821",    # String annotations with lazy imports: valid pattern, resolved by mypy
]
"src/codetoreum/infrastructure/simulation/bootstrap.py" = [
    "F821",    # String annotations with lazy imports in nested class: valid pattern
]
"documentation/api/examples/**/*.py" = [
    "S105",    # Hardcoded password in example code (placeholders only)
    "S113",    # Requests without timeout (acceptable in examples)
    "T20",     # Print statements allowed in examples
    "TRY400",  # logging.exception style (examples use logging)
    "TRY401",  # Redundant exception in logging (acceptable in examples)
    "ARG",     # Unused arguments allowed in example code
    "ANN",     # Type annotations not required in examples
    "E501",    # Line length (examples often show API patterns)
    "EM102",   # Exception f-strings acceptable in examples
    "DTZ005",  # datetime.now() without tz acceptable in examples
    "C901",    # Complexity limits relaxed for examples
    "PLR0912", # Too many branches acceptable in examples
    "PLR0915", # Too many statements acceptable in examples
    "BLE001",  # Catch blind exception acceptable in examples
    "ERA001",  # Commented-out code acceptable in examples
]
"documentation/api/generate_openapi.py" = [
    "INP001",  # Not a package, standalone script
    "T201",    # Print statements acceptable in utility script
    "PLC0415", # Import in function acceptable for lazy loading
    "PTH123",  # open() acceptable in utility script
]
"documentation/api/sdk/python/**/*.py" = [
    "ANN401",  # Dynamically typed expressions allowed in SDK (client injection pattern)
]
"scripts/**/*.py" = [
    "T201",    # Print statements acceptable in CLI scripts
    "ARG",     # Unused arguments acceptable in CLI scripts
    "ANN",     # Type annotations not required in CLI scripts
]
"src/codetoreum/adapters/primary/app_example.py" = [
    "ANN201",  # Return type annotations optional in example code
    "S104",    # Binding to all interfaces acceptable in example
    "G004",    # f-strings acceptable in example logging
]
"__init__.py" = [
    "F401",    # Imported but unused
]

[tool.ruff.lint.isort]
known-first-party = ["codetoreum"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ===== MyPy Configuration =====
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Adapter and infrastructure modules use dynamic patterns (FastAPI dependency
# injection, external SDKs, async generics, mock implementations) that are
# inherently difficult to type strictly. These modules are excluded from the
# domain/application/ports strict typing requirements.
#
# ignore_errors = true is used where disallow_untyped_defs alone is insufficient
# because the remaining errors are structural (async Callable generics, SDK type
# mismatches, dynamic dispatch patterns) rather than missing annotations.
[[tool.mypy.overrides]]
module = "codetoreum.adapters.*"
ignore_errors = true

# Infrastructure: cross-cutting concerns use dynamic async patterns, external SDK
# integrations, and resilience decorators with Callable[[], T] vs Coroutine
# type mismatches that are inherent to generic resilience infrastructure.
[[tool.mypy.overrides]]
module = "codetoreum.infrastructure.*"
ignore_errors = true

# CLI scripts: command-line entry points with dynamic argument handling.
[[tool.mypy.overrides]]
module = "codetoreum.cli.*"
ignore_errors = true

# Documentation utility scripts: not part of core package, excluded from type checking
[[tool.mypy.overrides]]
module = "documentation.*"
ignore_errors = true

# ===== Pytest Configuration =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--timeout=120",
    # Coverage collection removed from default runs to reduce memory usage
    # Use 'make test-cov' or add --cov flags manually when coverage is needed
]
markers = [
    "unit: Unit tests for isolated components",
    "integration: Integration tests with external dependencies",
    "simulation: Full workflow simulation tests",
    "e2e: End-to-end tests",
    "slow: Tests that take significant time to run",
    "contract: Contract tests for adapter implementations",
    "timeout: Set a timeout for a test",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # Ignore ResourceWarnings and PytestUnraisableExceptionWarnings globally
    # These are triggered by docker-py's socket cleanup issues which are a known
    # limitation of the docker-py/urllib3 library stack. The sockets are cleaned
    # up by Python's garbage collector and don't cause actual resource leaks.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ===== Coverage Configuration =====
# Per-layer coverage enforcement is implemented via scripts/enforce_coverage.py
# which enforces:
#   - Domain layer (src/codetoreum/domain): 100%
#   - Application layer (src/codetoreum/application): 90%
#   - Overall: 80%
#
# The fail_under threshold below is a secondary safety net and should not be
# relied upon as the primary enforcement mechanism. Use 'make test-cov-enforce'
# or 'python3 scripts/enforce_coverage.py' to run tests with per-layer enforcement.

[tool.coverage.run]
source = ["src/codetoreum"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "class .*\\bProtocol\\):",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Coverage targets per layer
[tool.coverage.paths]
source = ["src/codetoreum"]
