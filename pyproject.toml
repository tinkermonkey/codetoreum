[tool.poetry]
name = "codetoreum"
version = "0.1.0"
description = "AI Agent Orchestration Platform for automating software development workflows"
authors = ["Codetoreum Team"]
readme = "README.md"
packages = [{include = "codetoreum", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
redis = "^5.2.0"
elasticsearch = "^8.0.0"
docker = "^7.1.0"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
httpx = "^0.27.2"
aiohttp = "^3.9.0"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.2"
jinja2 = "^3.1.4"
asyncio = "^3.4.3"
aiofiles = "^24.1.0"
typer = "^0.12.0"
rich = "^13.7.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
email-validator = "^2.1.0"
opentelemetry-api = "^1.39.1"
opentelemetry-sdk = "^1.39.1"
opentelemetry-exporter-otlp-proto-grpc = "^1.39.1"
opentelemetry-instrumentation-fastapi = "^0.60b1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.2.0"
pytest-xdist = "^3.5.0"
ruff = "^0.7.4"
black = "^24.10.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
testcontainers = "^4.8.2"
slowapi = "^0.1.9"
types-python-dateutil = "^2.9.0.20260124"
types-requests = "^2.32.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.44"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ===== Black Configuration =====
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ===== Ruff Configuration =====
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "BLE", # flake8-blind-except
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ",  # flake8-django
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN101", # Missing type annotation for self in method
    "ANN102", # Missing type annotation for cls in classmethod
    "COM812", # Missing trailing comma (conflicts with formatter)
    "ISC001", # Implicitly concatenated string literals (conflicts with formatter)
    "S101",   # Use of assert detected (acceptable in tests)
    "PLR0913", # Too many arguments in function definition
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "ARG",     # Unused function args allowed in tests
    "PLR2004", # Magic value used in comparison
    "ANN",     # Type annotations not required in all tests
]
"documentation/api/examples/**/*.py" = [
    "S105",    # Hardcoded password in example code (placeholders only)
    "S113",    # Requests without timeout (acceptable in examples)
    "T20",     # Print statements allowed in examples
    "TRY400",  # logging.exception style (examples use logging)
    "TRY401",  # Redundant exception in logging (acceptable in examples)
    "ARG",     # Unused arguments allowed in example code
    "ANN",     # Type annotations not required in examples
    "E501",    # Line length (examples often show API patterns)
    "EM102",   # Exception f-strings acceptable in examples
    "DTZ005",  # datetime.now() without tz acceptable in examples
    "C901",    # Complexity limits relaxed for examples
    "PLR0912", # Too many branches acceptable in examples
    "PLR0915", # Too many statements acceptable in examples
    "BLE001",  # Catch blind exception acceptable in examples
    "ERA001",  # Commented-out code acceptable in examples
]
"documentation/api/sdk/python/**/*.py" = [
    "ANN401",  # Dynamically typed expressions allowed in SDK (client injection pattern)
]
"__init__.py" = [
    "F401",    # Imported but unused
]

[tool.ruff.lint.isort]
known-first-party = ["codetoreum"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ===== MyPy Configuration =====
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Adapter and infrastructure modules use dynamic patterns (FastAPI dependency
# injection, external SDKs, async generics, mock implementations) that are
# inherently difficult to type strictly. These modules are excluded from the
# domain/application/ports strict typing requirements.
#
# ignore_errors = true is used where disallow_untyped_defs alone is insufficient
# because the remaining errors are structural (async Callable generics, SDK type
# mismatches, dynamic dispatch patterns) rather than missing annotations.
[[tool.mypy.overrides]]
module = "codetoreum.adapters.*"
ignore_errors = true

# Infrastructure: cross-cutting concerns use dynamic async patterns, external SDK
# integrations, and resilience decorators with Callable[[], T] vs Coroutine
# type mismatches that are inherent to generic resilience infrastructure.
[[tool.mypy.overrides]]
module = "codetoreum.infrastructure.*"
ignore_errors = true

# CLI scripts: command-line entry points with dynamic argument handling.
[[tool.mypy.overrides]]
module = "codetoreum.cli.*"
ignore_errors = true

# Documentation utility scripts: not part of core package, excluded from type checking
[[tool.mypy.overrides]]
module = "documentation.*"
ignore_errors = true

# ===== Pytest Configuration =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    # Coverage collection removed from default runs to reduce memory usage
    # Use 'make test-cov' or add --cov flags manually when coverage is needed
]
markers = [
    "unit: Unit tests for isolated components",
    "integration: Integration tests with external dependencies",
    "simulation: Full workflow simulation tests",
    "e2e: End-to-end tests",
    "slow: Tests that take significant time to run",
    "contract: Contract tests for adapter implementations",
    "timeout: Set a timeout for a test",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # Ignore ResourceWarnings and PytestUnraisableExceptionWarnings globally
    # These are triggered by docker-py's socket cleanup issues which are a known
    # limitation of the docker-py/urllib3 library stack. The sockets are cleaned
    # up by Python's garbage collector and don't cause actual resource leaks.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ===== Coverage Configuration =====
[tool.coverage.run]
source = ["src/codetoreum"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "class .*\\bProtocol\\):",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# Coverage targets per layer
[tool.coverage.paths]
source = ["src/codetoreum"]
