exclude: ^venv_test/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^tests/unit/infrastructure/test_logging\.py$
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter with auto-fix)
        language: system
        entry: ruff check --fix
        types: [python]

      - id: ruff-format
        name: ruff (formatter)
        language: system
        entry: ruff format
        types: [python]

      - id: mypy
        name: mypy
        language: system
        entry: mypy
        args: [src/, --ignore-missing-imports]
        pass_filenames: false
        always_run: true

      - id: pytest-check
        name: pytest-check
        entry: pytest tests/unit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
