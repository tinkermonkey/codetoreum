exclude: ^(venv_test/|venv_integration/|legacy_ux/node_modules/|legacy_ux/dist/|node_modules/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(legacy_ux/dist/|frontend/playwright-report/|.*-report/)
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^tests/unit/infrastructure/test_logging\.py$
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter with auto-fix)
        language: system
        entry: ruff check --fix
        types: [python]

      - id: black
        name: black (code formatter)
        language: system
        entry: black
        types: [python]

      - id: mypy
        name: mypy
        language: system
        entry: mypy
        args: [src/, --ignore-missing-imports]
        pass_filenames: false
        always_run: true

      - id: pytest-check
        name: pytest-check
        entry: pytest tests/unit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: forbid-positional-external-service-error
        name: forbid positional ExternalServiceError construction
        description: Forbids positional construction of ExternalServiceError to enforce keyword-only args
        language: system
        entry: bash -c 'grep -r "ExternalServiceError([^)]*[\"'\'']" --include="*.py" . | grep -v "service=" | grep -v "message=" | grep -v "test_external_service_error.py" && exit 1 || exit 0'
        types: [python]
        pass_filenames: false
