# Mixed Full Real Scenario — Container Configuration
#
# Port/Interface: IContainer (DockerContainerAdapter settings)
# Real container execution — startup and command delays reflect actual Docker timing.

containers:
  default_exit_code: 0
  execution_delay: 2.0    # Real container startup/execution
  command_exit_codes:
    "pytest": 0
    "npm test": 0
    "black": 0
    "mypy": 0
  command_outputs:
    "pytest": { stdout: "===== 127 passed in 23.45s =====", stderr: "" }
    "npm test": { stdout: "Test Suites: 8 passed, 8 total; Tests: 342 passed, 342 total", stderr: "" }
    "black": { stdout: "All done! ✨", stderr: "" }
