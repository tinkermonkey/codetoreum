# Mixed Full GitHub Scenario — Environment Variables
#
# Port/Interface: IIdentityService, IBoardService, IEventStore, IContainer (credentials)

environment_variables:
  # GitHub credentials
  GITHUB_TOKEN: required  # Set via: export GITHUB_TOKEN="ghp_..."
  GITHUB_ORG: required    # Set via: export GITHUB_ORG="your-org"
  GITHUB_REPO: required   # Set via: export GITHUB_REPO="your-org/your-repo"

  # Redis (for event store, message broker, locks) — not yet implemented
  REDIS_URL: required  # Set via: export REDIS_URL="redis://localhost:6379/0"

  # PostgreSQL (for config, workflows, registries)
  DATABASE_URL: required  # Set via: export DATABASE_URL="postgresql://user:pass@localhost:5432/codetoreum"

  # AWS S3 (for artifact storage)
  AWS_ACCESS_KEY_ID: optional
  AWS_SECRET_ACCESS_KEY: optional
  AWS_S3_BUCKET: optional

  # Docker (must have daemon access at /var/run/docker.sock — no env var needed)
