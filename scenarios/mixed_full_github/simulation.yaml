# Mixed Full GitHub Scenario — Simulation Settings
#
# Port/Interface: SimulationConfig (speed, fidelity, clock)
# Adapter: SimulationClock, SimulationApplicationBootstrap
#
# Real GitHub + Real Infrastructure (Docker/Redis/PostgreSQL), simulated agents.
# Useful for integration testing with real GitHub issues and infrastructure
# but keeping LLM responses deterministic.
#
# IMPORTANT: Redis adapters (event_store, message_broker, lock_service, queue_service)
# are not yet registered in AdapterFactory. Loading this scenario will fail at runtime.
# See documentation/01_design/adapters/ADAPTER_REGISTRATION_STATUS.md — Issue #474.

name: mixed_full_github
description: Real GitHub, real infrastructure (Docker/Redis/PostgreSQL), simulated agents
version: "1.0"

# Fidelity level: MEDIUM = realistic timing with causal linking via events
fidelity: MEDIUM

# Simulation timing
simulation:
  speed_multiplier: 10.0
  start_time: null  # Current time
