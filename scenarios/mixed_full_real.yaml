# Full Production Configuration: All Real Systems
#
# Use Case:
#   Production deployment or production-like testing with all real systems.
#   Useful for:
#   - End-to-end testing with real services
#   - Production deployments
#   - Performance and load testing
#   - Chaos engineering and failure scenarios
#
# Credentials Required:
#   GitHub:
#     - GITHUB_TOKEN (repo, project scopes)
#     - GITHUB_ORG
#     - GITHUB_REPO
#   Claude Code:
#     - CLAUDE_CODE_API_KEY (or CLI authentication)
#   Docker:
#     - Docker daemon socket at /var/run/docker.sock
#   AWS S3 (for artifact storage):
#     - AWS_ACCESS_KEY_ID
#     - AWS_SECRET_ACCESS_KEY
#     - AWS_S3_BUCKET
#   Redis (for event store, message broker, locks):
#     - REDIS_URL (or REDIS_HOST + REDIS_PORT)
#   PostgreSQL (for configuration, workflows):
#     - DATABASE_URL (or POSTGRES_* environment variables)
#   Slack (for notifications):
#     - SLACK_BOT_TOKEN (or SLACK_WEBHOOK_URL)
#
# Performance:
#   Speed: 1-5x faster than wall-clock time (real services, realistic timing)
#   Determinism: Low (real external systems with variability)
#   Cost: High (Claude Code API calls, external services)

name: mixed_full_real
description: All real systems - production deployment configuration
version: "1.0"

# Fidelity level: HIGH = full simulation fidelity with realistic timing
fidelity: HIGH

# Simulation timing
simulation:
  speed_multiplier: 1.0  # Real-time (no acceleration)
  start_time: null       # Current time

# Adapter configuration - ALL PRODUCTION
adapters:
  # Real GitHub adapters
  board: github
  ticket: github
  discussion_adapter: github
  review_cycle: github
  work_item_service: github
  identity_service: github

  # Real LLM and Container
  llm: claude_code        # Real Claude Code API
  container: docker       # Real Docker daemon

  # Real Infrastructure
  version_control: git    # Real Git operations (planned)
  event_store: redis      # Real Redis event store
  message_broker: redis   # Real Redis pub/sub
  lock_service: redis     # Real Redis distributed locks

  # Real Configuration Storage
  config_store: postgres  # Real PostgreSQL
  workflow_config: postgres  # Real PostgreSQL

  # Real Artifact Storage
  storage: s3             # Real AWS S3

  # Real Observability
  metrics: prometheus     # Real Prometheus
  notifier: slack         # Real Slack notifications

  # Additional production adapters
  encryption: vault       # Real HashiCorp Vault (planned)
  repair_cycle: real      # Real repair orchestrator (planned)
  project_manager: github # Real GitHub organization APIs
  checkpoint_store: s3    # Real S3 checkpoints
  agent_repository: postgres  # Real database
  run_registry: postgres   # Real database
  branch_tracker: postgres # Real database
  event_emitter: real     # Real event emitter
  queue_service: redis    # Real Redis queue

# Agent behavior configuration
agents:
  - agent_id: reviewer
    execution_delay: 5.0   # Real Claude Code calls take 5-30 seconds
    success_rate: 0.99     # Very high success rate for production
    token_usage:
      input: 2000
      output: 1000

  - agent_id: analyzer
    execution_delay: 4.0
    success_rate: 0.99
    token_usage:
      input: 1500
      output: 800

  - agent_id: implementer
    execution_delay: 8.0   # Code generation takes longer
    success_rate: 0.95
    token_usage:
      input: 3000
      output: 2000

  - agent_id: tester
    execution_delay: 6.0
    success_rate: 0.98
    token_usage:
      input: 2500
      output: 1500

# Container behavior configuration
containers:
  default_exit_code: 0
  execution_delay: 2.0    # Real container startup/execution
  command_exit_codes:
    "pytest": 0
    "npm test": 0
    "black": 0
    "mypy": 0
  command_outputs:
    "pytest": { stdout: "===== 127 passed in 23.45s =====", stderr: "" }
    "npm test": { stdout: "Test Suites: 8 passed, 8 total; Tests: 342 passed, 342 total", stderr: "" }
    "black": { stdout: "All done! ✨", stderr: "" }

# Notification configuration
notifications:
  send_delay: 0.1         # Real Slack API calls
  simulate_failures: false  # Don't simulate failures in production
  failure_rate: 0.0

# Metrics configuration
metrics:
  collect_enabled: true
  detailed_tracking: true
  prometheus_scrape_interval: 15  # Prometheus scrape every 15 seconds

# Scenario test cases (production workflows)
test_scenarios:
  - name: full_production_workflow
    description: Complete workflow with all real systems
    steps:
      - action: trigger_workflow
        params:
          issue_id: github_real_issue_id
          workflow_type: full_sdlc
      - action: wait_for_event
        params:
          event_type: WorkflowStarted
          timeout_seconds: 60
      - action: advance_time
        params:
          delta_seconds: 600  # 10 minutes real time
      - action: assert_event
        params:
          event_type: AgentExecutionStarted
      - action: assert_event
        params:
          event_type: ReviewStatusChangedEvent
      - action: assert_event
        params:
          event_type: WorkItemColumnChangedEvent

  - name: production_failure_recovery
    description: Recovery workflow with real container failures
    steps:
      - action: trigger_workflow
        params:
          issue_id: github_real_issue_id
          workflow_type: failure_recovery
      - action: wait_for_event
        params:
          event_type: ContainerKilledEvent
          timeout_seconds: 30
      - action: wait_for_event
        params:
          event_type: ContainerRecoveredEvent
          timeout_seconds: 60

  - name: production_multi_agent_orchestration
    description: Multiple agents working on single issue with real concurrency
    steps:
      - action: trigger_workflow
        params:
          issue_id: github_real_issue_id
          workflow_type: parallel_review
      - action: advance_time
        params:
          delta_seconds: 1200  # 20 minutes
      - action: assert_state
        params:
          check: all_agents_completed
          expected_count: 4

# Environment variable references (all required for production)
environment_variables:
  # GitHub
  GITHUB_TOKEN: required      # Set via: export GITHUB_TOKEN="ghp_..."
  GITHUB_ORG: required        # Set via: export GITHUB_ORG="anthropic"
  GITHUB_REPO: required       # Set via: export GITHUB_REPO="anthropic/codetoreum"
  GITHUB_API_URL: optional    # Default: https://api.github.com (for GH Enterprise)

  # Claude Code
  CLAUDE_CODE_API_KEY: required  # Set via: export CLAUDE_CODE_API_KEY="sk_..."
  # OR: Use CLI authentication (claude-code auth login)

  # AWS S3 (for artifacts)
  AWS_ACCESS_KEY_ID: required
  AWS_SECRET_ACCESS_KEY: required
  AWS_S3_BUCKET: required
  AWS_REGION: optional  # Default: us-east-1

  # Redis (for event store, message broker, locks)
  REDIS_URL: optional  # Set via: export REDIS_URL="redis://localhost:6379/0"
  # OR:
  REDIS_HOST: optional
  REDIS_PORT: optional
  REDIS_PASSWORD: optional

  # PostgreSQL (for configuration, workflows)
  DATABASE_URL: optional  # Set via: export DATABASE_URL="postgresql://user:pass@host:5432/codetoreum"
  # OR:
  POSTGRES_USER: optional
  POSTGRES_PASSWORD: optional
  POSTGRES_HOST: optional
  POSTGRES_PORT: optional
  POSTGRES_DB: optional

  # Slack (for notifications)
  SLACK_BOT_TOKEN: optional  # Set via: export SLACK_BOT_TOKEN="xoxb_..."
  # OR:
  SLACK_WEBHOOK_URL: optional  # Set via: export SLACK_WEBHOOK_URL="https://hooks.slack.com/..."

  # Prometheus (for metrics)
  PROMETHEUS_URL: optional  # Default: http://localhost:9090

  # Docker (must have daemon access)
  # No explicit env var needed - requires /var/run/docker.sock

# Monitoring and observability
monitoring:
  tracing_enabled: true
  tracing_provider: jaeger
  metrics_scrape_interval: 15
  log_level: INFO
  audit_logging_enabled: true

# Scenario configuration
scenario_config:
  # All adapters are real - no overrides
  adapter_overrides:
    - all_real

  # Load order
  load_order:
    - default_simulation_config
    - full_production_overrides
    - environment_overrides

# Production deployment notes
deployment:
  description: |
    This configuration is suitable for production deployment or production-like testing.

    Prerequisites:
    1. All external services must be running and accessible:
       - GitHub (api.github.com or GitHub Enterprise)
       - Claude Code API (via API key or CLI authentication)
       - Docker daemon (socket at /var/run/docker.sock)
       - Redis (for event store, message broker, locks)
       - PostgreSQL (for configuration, workflow definitions)
       - AWS S3 (for artifact storage)
       - Slack (for notifications)
       - Prometheus (optional, for metrics collection)

    2. All credentials must be set in environment variables
       (See environment_variables section above)

    3. Security considerations:
       - Store credentials in secure vault (AWS Secrets Manager, Vault, etc.)
       - Use least privilege IAM policies for AWS
       - Enable audit logging for GitHub and database
       - Monitor external service API usage and costs
       - Implement rate limiting and circuit breakers
       - Enable TLS/SSL for all external connections

    4. Cost considerations:
       - Claude Code API: ~$0.003 per 1K input tokens, ~$0.015 per 1K output tokens
       - AWS S3: Storage + API call costs
       - AWS RDS PostgreSQL: Instance + storage costs
       - GitHub API: Free tier 5,000 requests/hour
       - Slack API: Free tier 1,000 API calls/hour

    5. Monitoring and alerting:
       - Set up CloudWatch alarms for AWS resources
       - Monitor GitHub API rate limits
       - Track Claude Code token usage
       - Monitor database connection pool usage
       - Alert on workflow failures and timeouts

  recommended_resources:
    - Redis: 2GB memory minimum (for event store + message broker)
    - PostgreSQL: t3.small or larger
    - Docker: Host machine with 4+ CPU cores, 8GB+ RAM
    - Bandwidth: 10+ Mbps for LLM API calls

  maintenance:
    - Backup PostgreSQL daily
    - Monitor Redis memory usage
    - Rotate credentials every 90 days
    - Archive old events to cold storage
    - Clean up expired S3 artifacts
