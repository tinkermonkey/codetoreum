# Stress Test Scenario
#
# High-volume scenario with 100 work items executing in parallel.
# Tests concurrent execution, resource management, and scalability.

name: "Stress Test Scenario"
description: "High-volume scenario for performance and scalability testing"
version: "1.0"

# Simulation settings (fast execution)
speed_multiplier: 100.0
auto_advance: true

# Projects
projects:
  - name: "stress-test-project"
    description: "Project for stress testing and performance validation"
    default_branch: "main"
    metadata:
      environment: "performance_test"
      load_type: "high_concurrency"

# Workflows
workflows:
  - name: "parallel-workflow"
    description: "Simple workflow optimized for parallel execution"
    stages:
      - name: "process"
        agent_type: "worker"
        description: "Process work item"
        order: 1
        max_retries: 2
        timeout_seconds: 300

      - name: "validate"
        agent_type: "validator"
        description: "Validate output"
        order: 2
        max_retries: 1
        timeout_seconds: 180

# Agents
agents:
  - name: "worker"
    agent_type: "worker"
    description: "Worker agent for parallel processing"
    capabilities:
      - "code_generation"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.7
    max_tokens: 2048
    enabled: true
    metadata:
      worker_pool: "primary"

  - name: "validator"
    agent_type: "validator"
    description: "Validation agent"
    capabilities:
      - "code_review"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.5
    max_tokens: 1024
    enabled: true
    metadata:
      validation_mode: "fast"

# Work Items (100 items for stress testing)
work_items:
  - title: "Stress Test Task #1"
    description: "Automated stress test work item"
    labels: ["stress-test", "batch-1"]
    priority: "medium"
    status: "new"

