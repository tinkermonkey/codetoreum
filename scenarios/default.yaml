# Default Scenario
#
# Basic scenario with 3 work items, 1 workflow, and 3 agents.
# This is a minimal scenario for smoke testing.

name: "Default Scenario"
description: "Basic test scenario with minimal configuration"
version: "1.0"

# Simulation settings
speed_multiplier: 10.0
auto_advance: false

# Projects
projects:
  - name: "default-project"
    description: "Default test project"
    default_branch: "main"
    metadata:
      environment: "test"
      team: "qa"

# Workflows
workflows:
  - name: "default-workflow"
    description: "Default 3-stage workflow"
    stages:
      - name: "design"
        agent_type: "architect"
        description: "Design the solution"
        order: 1
        max_retries: 3
        timeout_seconds: 3600

      - name: "implementation"
        agent_type: "coder"
        description: "Implement the solution"
        order: 2
        max_retries: 3
        timeout_seconds: 3600

      - name: "testing"
        agent_type: "tester"
        description: "Test the implementation"
        order: 3
        max_retries: 3
        timeout_seconds: 3600

# Agents
agents:
  - name: "architect"
    agent_type: "architect"
    description: "Software architect agent"
    capabilities:
      - "code_generation"
      - "code_review"
    llm_model: "claude-sonnet-4-5-20250929"
    temperature: 0.7
    max_tokens: 4096
    enabled: true

  - name: "coder"
    agent_type: "coder"
    description: "Software developer agent"
    capabilities:
      - "code_generation"
    llm_model: "claude-sonnet-4-5-20250929"
    temperature: 0.7
    max_tokens: 4096
    enabled: true

  - name: "tester"
    agent_type: "tester"
    description: "QA tester agent"
    capabilities:
      - "code_review"
      - "testing"
    llm_model: "claude-sonnet-4-5-20250929"
    temperature: 0.7
    max_tokens: 4096
    enabled: true

# Work Items
work_items:
  - title: "Default Issue #1"
    description: "First test work item"
    labels:
      - "test"
      - "default"
    priority: "medium"
    status: "new"

  - title: "Default Issue #2"
    description: "Second test work item"
    labels:
      - "test"
      - "default"
    priority: "medium"
    status: "new"

  - title: "Default Issue #3"
    description: "Third test work item"
    labels:
      - "test"
      - "default"
    priority: "high"
    status: "new"

# Boards
boards:
  - board_id: "board-1"
    board_name: "Default Board"
    columns: ["Backlog", "Ready", "In Progress", "Review", "Done"]

# Board placements
board_placements:
  - work_item_title: "Default Issue #1"
    column: "Backlog"
  - work_item_title: "Default Issue #2"
    column: "Backlog"
  - work_item_title: "Default Issue #3"
    column: "Backlog"

# Additional metadata
metadata:
  scenario_type: "smoke_test"
  author: "codetoreum-team"
  tags:
    - "basic"
    - "smoke-test"
