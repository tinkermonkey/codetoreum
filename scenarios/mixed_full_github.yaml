# Mixed Configuration: Real GitHub + Real Infrastructure + Simulated LLM
#
# Use Case:
#   Testing complete GitHub integration with real infrastructure (Docker, Redis, PostgreSQL)
#   but keeping LLM responses deterministic for consistent testing. Useful for:
#   - Integration testing with real GitHub issues and infrastructure
#   - Avoiding Claude Code API costs during testing
#   - Testing container execution and database interactions without LLM variability
#
# Credentials Required:
#   GITHUB_TOKEN - Personal Access Token (repo, project scopes)
#   GITHUB_ORG - GitHub organization name
#   GITHUB_REPO - Repository in org/repo format
#   REDIS_URL - Redis connection [NOT YET IMPLEMENTED - see ADAPTER_REGISTRATION_STATUS.md]
#   DATABASE_URL - PostgreSQL connection (for config, workflows)
#   Docker - Docker daemon socket at /var/run/docker.sock
#
# Performance:
#   Speed: 5-10x faster than all-real (no LLM inference, fast container execution)
#   Determinism: High (mock agents + real systems)
#
# IMPORTANT: Redis Adapters Not Yet Implemented
#   This scenario references Redis adapters for event_store, message_broker, lock_service,
#   and queue_service which are not yet registered in AdapterFactory.
#   Loading this scenario will fail at runtime with AdapterConfigurationError.
#   See documentation/01_design/adapters/ADAPTER_REGISTRATION_STATUS.md for details.
#   Issue #474 tracks this limitation.

name: mixed_full_github
description: Real GitHub, real infrastructure (Docker/Redis/PostgreSQL), simulated agents
version: "1.0"

# Fidelity level: MEDIUM = realistic timing with causal linking via events
fidelity: MEDIUM

# Simulation timing
simulation:
  speed_multiplier: 10.0
  start_time: null  # Current time

# Adapter configuration - GITHUB + INFRASTRUCTURE REAL, LLM SIMULATED
adapters:
  # Real GitHub adapters
  board: github          # Real GitHub project board
  ticket: github         # Real GitHub issues/PRs
  discussion_adapter: github   # Real GitHub issue comments (note: corrected field name)
  review_cycle: github   # Real GitHub code reviews
  work_item_service: github  # Real GitHub work items
  identity_service: github   # Real GitHub user identification

  # Simulated LLM (deterministic)
  llm: mock              # Deterministic mock LLM responses

  # Real Container (Docker)
  container: docker      # Real Docker daemon

  # Real Infrastructure
  version_control: git   # Real Git operations
  event_store: redis     # Real Redis event store
  message_broker: redis  # Real Redis pub/sub
  lock_service: redis    # Real Redis distributed locks

  # Real Configuration Storage (PostgreSQL)
  config_store: postgres  # Real PostgreSQL
  workflow_config: postgres  # Real PostgreSQL

  # Real Artifact Storage
  storage: s3             # Real AWS S3 (or mock for local testing)

  # Observability
  metrics: in_memory      # Mock metrics for determinism
  notifier: mock          # Mock notifications
  encryption: simple
  repair_cycle: mock      # Mock repair cycle (LLM-dependent)
  project_manager: mock
  checkpoint_store: in_memory
  agent_repository: postgres  # Database-backed agent registry
  run_registry: postgres      # Database-backed run registry
  branch_tracker: postgres    # Database-backed branch tracking
  event_emitter: capturing    # Capturing mock for testing
  queue_service: redis    # Real Redis queue

# Agent behavior configuration
agents:
  - agent_id: reviewer
    execution_delay: 0.2
    success_rate: 0.95
    response_patterns:
      code_review: "Code review completed. No issues found."
      feedback: "Changes look good, proceeding to next stage."

  - agent_id: analyzer
    execution_delay: 0.15
    success_rate: 0.98
    response_patterns:
      analysis: "Analysis complete. All requirements met."
      test: "Tests passing, coverage at 95%."

  - agent_id: implementer
    execution_delay: 0.3
    success_rate: 0.92
    response_patterns:
      implementation: "Implementation complete and tested."

  - agent_id: tester
    execution_delay: 0.25
    success_rate: 0.97
    response_patterns:
      test_results: "All tests passing."

# Container behavior configuration
containers:
  default_exit_code: 0
  execution_delay: 0.5    # Real Docker startup takes time
  command_exit_codes:
    "pytest": 0
    "npm test": 0
    "black": 0
    "mypy": 0
  command_outputs:
    "pytest": { stdout: "===== 127 passed in 23.45s =====", stderr: "" }
    "npm test": { stdout: "Test Suites: 8 passed, 8 total; Tests: 342 passed, 342 total", stderr: "" }
    "black": { stdout: "All done! ✨", stderr: "" }
    "mypy": { stdout: "Success: no issues found in 45 source files", stderr: "" }

# Notification configuration
notifications:
  send_delay: 0.01
  simulate_failures: false
  failure_rate: 0.0

# Metrics configuration
metrics:
  collect_enabled: true
  detailed_tracking: false

# Scenario test cases
test_scenarios:
  - name: github_docker_postgres_workflow
    description: Full workflow with real GitHub, Docker, and PostgreSQL
    steps:
      - action: trigger_workflow
        params:
          issue_id: 1
          workflow_type: standard_review
      - action: wait_for_event
        params:
          event_type: WorkflowStarted
          timeout_seconds: 30
      - action: advance_time
        params:
          delta_seconds: 120
      - action: assert_event
        params:
          event_type: ReviewStatusChangedEvent
      - action: assert_event
        params:
          event_type: WorkItemColumnChangedEvent

  - name: github_container_execution
    description: Test real GitHub + Docker container execution with mock LLM
    steps:
      - action: trigger_workflow
        params:
          issue_id: 2
          workflow_type: test_execution
      - action: wait_for_event
        params:
          event_type: ContainerExecutionStarted
          timeout_seconds: 30
      - action: advance_time
        params:
          delta_seconds: 60
      - action: assert_event
        params:
          event_type: ContainerExecutionCompleted

# Environment variable references (required)
environment_variables:
  # GitHub credentials
  GITHUB_TOKEN: required  # Set via: export GITHUB_TOKEN="ghp_..."
  GITHUB_ORG: required    # Set via: export GITHUB_ORG="anthropic"
  GITHUB_REPO: required   # Set via: export GITHUB_REPO="anthropic/codetoreum"

  # Redis (for event store, message broker, locks)
  REDIS_URL: required  # Set via: export REDIS_URL="redis://localhost:6379/0"

  # PostgreSQL (for config, workflows, registries)
  DATABASE_URL: required  # Set via: export DATABASE_URL="postgresql://user:pass@localhost:5432/codetoreum"

  # AWS S3 (for artifact storage)
  AWS_ACCESS_KEY_ID: optional
  AWS_SECRET_ACCESS_KEY: optional
  AWS_S3_BUCKET: optional

  # Docker (must have daemon access)
  # No explicit env var needed - requires /var/run/docker.sock

# Scenario configuration
scenario_config:
  # Which adapters to override from this config
  adapter_overrides:
    - board
    - ticket
    - discussion_adapter
    - review_cycle
    - work_item_service
    - identity_service
    - container
    - event_store
    - message_broker
    - lock_service
    - config_store
    - workflow_config
    - agent_repository
    - run_registry
    - branch_tracker
    - queue_service

  # Load order
  load_order:
    - default_simulation_config
    - scenario_adapters
    - environment_overrides
