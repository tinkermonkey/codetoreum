# Smoke Scenario — Board Configuration
#
# Port/Interface: IBoardService, IWorkflowConfigService
# Adapter (sim): MockBoardAdapter, InMemoryWorkflowConfigService
#
# Board layout:
#   Backlog (manual) → Ready (manual) → In Progress (automated, coder, PIPELINE TRIGGER)
#   → Review (automated, tester) → Done (exit)

boards:
  - board_id: "board-1"
    board_name: "Default Board"
    columns:
      - "Backlog"
      - "Ready"
      - "In Progress"
      - "Review"
      - "Done"
    column_configs:
      - name: "Backlog"
        type: "manual"
        is_pipeline_trigger: false
        is_exit_column: false
        auto_progress_on_completion: false

      - name: "Ready"
        type: "manual"
        is_pipeline_trigger: false
        is_exit_column: false
        auto_progress_on_completion: false

      - name: "In Progress"
        type: "automated"
        agent_id: "coder"
        is_pipeline_trigger: true
        is_exit_column: false
        auto_progress_on_completion: true
        on_failure_column: "Backlog"
        sla_seconds: 3600

      - name: "Review"
        type: "automated"
        agent_id: "tester"
        is_pipeline_trigger: false
        is_exit_column: false
        auto_progress_on_completion: true
        on_failure_column: "Backlog"
        sla_seconds: 1800

      - name: "Done"
        type: "manual"
        is_pipeline_trigger: false
        is_exit_column: true
        auto_progress_on_completion: false

board_placements:
  - work_item_title: "Implement login page"
    column: "Backlog"
  - work_item_title: "Fix null pointer exception in user service"
    column: "Backlog"
  - work_item_title: "Add pagination to items list endpoint"
    column: "Backlog"
