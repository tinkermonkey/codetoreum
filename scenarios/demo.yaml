# Demo Scenario
#
# Demonstration scenario with realistic project structure and data.
# Showcases typical workflow with multiple stages and agent types.

name: "Demo Scenario"
description: "Realistic demo scenario for showcasing platform capabilities"
version: "1.0"

# Simulation settings (slower for demo visualization)
speed_multiplier: 5.0
auto_advance: false

# Projects
projects:
  - name: "web-app-project"
    description: "Modern web application project"
    repository_url: "https://github.com/demo-org/web-app.git"
    default_branch: "main"
    metadata:
      stack: "React + FastAPI"
      team: "product-engineering"
      priority: "high"

# Workflows
workflows:
  - name: "feature-development-workflow"
    description: "Complete feature development lifecycle"
    stages:
      - name: "architecture-design"
        agent_type: "software_architect"
        description: "Design system architecture and APIs"
        order: 1
        max_retries: 2
        timeout_seconds: 7200

      - name: "implementation"
        agent_type: "senior_developer"
        description: "Implement the feature"
        order: 2
        max_retries: 3
        timeout_seconds: 10800

      - name: "code-review"
        agent_type: "code_reviewer"
        description: "Review code quality and best practices"
        order: 3
        max_retries: 2
        timeout_seconds: 3600

      - name: "testing"
        agent_type: "qa_engineer"
        description: "Test functionality and edge cases"
        order: 4
        max_retries: 3
        timeout_seconds: 7200

      - name: "security-scan"
        agent_type: "security_analyst"
        description: "Security and vulnerability analysis"
        order: 5
        max_retries: 2
        timeout_seconds: 3600

# Agents
agents:
  - name: "software_architect"
    agent_type: "software_architect"
    description: "Senior software architect with system design expertise"
    capabilities:
      - "code_generation"
      - "code_review"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 8192
    system_prompt: "You are a senior software architect. Focus on system design, scalability, and best practices."
    enabled: true
    metadata:
      specialization: "distributed_systems"

  - name: "senior_developer"
    agent_type: "senior_developer"
    description: "Experienced full-stack developer"
    capabilities:
      - "code_generation"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 8192
    system_prompt: "You are a senior full-stack developer. Write clean, maintainable, well-tested code."
    enabled: true
    metadata:
      languages: ["Python", "TypeScript", "JavaScript"]

  - name: "code_reviewer"
    agent_type: "code_reviewer"
    description: "Code quality and best practices reviewer"
    capabilities:
      - "code_review"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.5
    max_tokens: 4096
    system_prompt: "You are a code reviewer. Focus on code quality, readability, and maintainability."
    enabled: true
    metadata:
      review_style: "constructive"

  - name: "qa_engineer"
    agent_type: "qa_engineer"
    description: "QA engineer specializing in test automation"
    capabilities:
      - "testing"
      - "code_generation"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.6
    max_tokens: 6144
    system_prompt: "You are a QA engineer. Write comprehensive tests and identify edge cases."
    enabled: true
    metadata:
      frameworks: ["pytest", "jest"]

  - name: "security_analyst"
    agent_type: "security_analyst"
    description: "Security specialist focusing on vulnerability detection"
    capabilities:
      - "security_analysis"
      - "code_review"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.4
    max_tokens: 4096
    system_prompt: "You are a security analyst. Identify vulnerabilities and security risks."
    enabled: true
    metadata:
      focus_areas: ["OWASP Top 10", "authentication", "data_protection"]

# Work Items
work_items:
  - title: "Add user authentication system"
    description: |
      Implement OAuth2-based authentication system with JWT tokens.

      Requirements:
      - OAuth2 provider integration (Google, GitHub)
      - JWT token generation and validation
      - Refresh token mechanism
      - Rate limiting for auth endpoints
    labels:
      - "feature"
      - "authentication"
      - "security"
    priority: "high"
    status: "new"
    metadata:
      estimated_hours: 16

  - title: "Implement real-time notifications"
    description: |
      Add WebSocket-based real-time notification system.

      Requirements:
      - WebSocket connection management
      - Event broadcasting
      - Client reconnection handling
      - Notification persistence
    labels:
      - "feature"
      - "websocket"
      - "real-time"
    priority: "medium"
    status: "new"
    metadata:
      estimated_hours: 12

  - title: "Create admin dashboard"
    description: |
      Build admin dashboard for system monitoring and configuration.

      Requirements:
      - User management interface
      - System metrics visualization
      - Configuration editor
      - Activity logs viewer
    labels:
      - "feature"
      - "admin"
      - "ui"
    priority: "medium"
    status: "new"
    metadata:
      estimated_hours: 20

  - title: "Optimize database queries"
    description: |
      Improve performance of slow database queries.

      - Add missing indexes
      - Optimize N+1 query patterns
      - Implement query result caching
      - Add connection pooling
    labels:
      - "performance"
      - "database"
      - "optimization"
    priority: "high"
    status: "new"
    metadata:
      estimated_hours: 8

  - title: "Add API rate limiting"
    description: |
      Implement rate limiting for public API endpoints.

      Requirements:
      - Token bucket algorithm
      - Per-user and per-IP limits
      - Custom limit configuration
      - Rate limit headers
    labels:
      - "feature"
      - "api"
      - "security"
    priority: "medium"
    status: "new"
    metadata:
      estimated_hours: 6

# Additional metadata
metadata:
  scenario_type: "demo"
  author: "codetoreum-team"
  use_case: "product_demonstration"
  tags:
    - "demo"
    - "realistic"
    - "full-lifecycle"
