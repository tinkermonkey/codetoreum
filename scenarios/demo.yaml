# SDLC Pipeline Scenario
#
# Canonical 7-stage SDLC workflow used as the primary simulation scenario.
# Matches Scenario 06 specification in SCENARIOS_COMPLETE.md.
#
# Stages: Requirements → Design → Implementation → Code Review → Testing → Integration → Release
# Simulated duration: ~45 minutes | Real duration at 100x: ~27 seconds

name: "SDLC Pipeline"
description: "Full 7-stage SDLC pipeline - canonical workflow for simulation testing"
version: "2.0"

# Simulation settings
speed_multiplier: 100.0
auto_advance: false

# Projects
projects:
  - name: "web-app-project"
    description: "Modern web application project"
    repository_url: "https://github.com/demo-org/web-app.git"
    default_branch: "main"
    metadata:
      stack: "React + FastAPI"
      team: "product-engineering"

# Workflows
workflows:
  - name: "sdlc-workflow"
    description: "Full 7-stage SDLC pipeline"
    stages:
      - name: "requirements"
        agent_type: "requirements_analyst"
        description: "Parse and understand requirements"
        order: 1
        max_retries: 2
        timeout_seconds: 600

      - name: "design"
        agent_type: "software_architect"
        description: "Create design document"
        order: 2
        max_retries: 2
        timeout_seconds: 1200

      - name: "implementation"
        agent_type: "senior_software_engineer"
        description: "Generate code"
        order: 3
        max_retries: 3
        timeout_seconds: 1800

      - name: "code-review"
        agent_type: "code_reviewer"
        description: "Review approval gate"
        order: 4
        max_retries: 2
        timeout_seconds: 1200

      - name: "testing"
        agent_type: "qa_engineer"
        description: "Run UNIT → INTEGRATION → E2E tests"
        order: 5
        max_retries: 3
        timeout_seconds: 2400

      - name: "integration"
        agent_type: "devops_engineer"
        description: "Merge to main branch"
        order: 6
        max_retries: 2
        timeout_seconds: 1200

      - name: "release"
        agent_type: "release_manager"
        description: "Prepare release notes"
        order: 7
        max_retries: 1
        timeout_seconds: 600

# Agents
agents:
  - name: "requirements_analyst"
    agent_type: "requirements_analyst"
    description: "Parses and structures requirements from issue descriptions"
    capabilities:
      - "code_review"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.5
    max_tokens: 4096
    enabled: true

  - name: "software_architect"
    agent_type: "software_architect"
    description: "Designs system architecture and produces design documents"
    capabilities:
      - "code_generation"
      - "code_review"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.7
    max_tokens: 8192
    enabled: true

  - name: "senior_software_engineer"
    agent_type: "senior_software_engineer"
    description: "Implements features based on design documents"
    capabilities:
      - "code_generation"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.7
    max_tokens: 8192
    enabled: true

  - name: "code_reviewer"
    agent_type: "code_reviewer"
    description: "Reviews code quality, correctness, and adherence to design"
    capabilities:
      - "code_review"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.5
    max_tokens: 4096
    enabled: true

  - name: "qa_engineer"
    agent_type: "qa_engineer"
    description: "Writes and runs UNIT, INTEGRATION, and E2E tests"
    capabilities:
      - "testing"
      - "code_generation"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.6
    max_tokens: 6144
    enabled: true

  - name: "devops_engineer"
    agent_type: "devops_engineer"
    description: "Merges branches and manages CI/CD pipeline"
    capabilities:
      - "code_generation"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.4
    max_tokens: 4096
    enabled: true

  - name: "release_manager"
    agent_type: "release_manager"
    description: "Prepares release notes and coordinates deployment"
    capabilities:
      - "code_review"
    llm_model: "claude-sonnet-4-6"
    temperature: 0.5
    max_tokens: 2048
    enabled: true

# Work Items
work_items:
  - title: "Add user authentication system"
    description: |
      Implement OAuth2-based authentication with JWT tokens.

      Requirements:
      - OAuth2 provider integration (Google, GitHub)
      - JWT token generation and validation
      - Refresh token mechanism
      - Rate limiting for auth endpoints
    labels:
      - "feature"
      - "authentication"
    priority: "high"
    status: "new"

  - title: "Implement real-time notifications"
    description: |
      Add WebSocket-based real-time notification system.

      Requirements:
      - WebSocket connection management
      - Event broadcasting
      - Client reconnection handling
      - Notification persistence
    labels:
      - "feature"
      - "websocket"
    priority: "medium"
    status: "new"

  - title: "Optimize database queries"
    description: |
      Improve performance of slow database queries.

      - Add missing indexes
      - Optimize N+1 query patterns
      - Implement query result caching
    labels:
      - "performance"
      - "database"
    priority: "high"
    status: "new"

# Boards
boards:
  - board_id: "board-1"
    board_name: "SDLC Board"
    columns: ["Backlog", "Ready", "In Progress", "Code Review", "Testing", "Done"]

# Board placements
board_placements:
  - work_item_title: "Add user authentication system"
    column: "Backlog"
  - work_item_title: "Implement real-time notifications"
    column: "Backlog"
  - work_item_title: "Optimize database queries"
    column: "Backlog"

# Additional metadata
metadata:
  scenario_type: "sdlc_pipeline"
  author: "codetoreum-team"
  scenario_ref: "Scenario 06 (SCENARIOS_COMPLETE.md)"
  tags:
    - "sdlc"
    - "full-lifecycle"
    - "canonical"
