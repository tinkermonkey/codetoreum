# Mixed GitHub Scenario — Simulation Settings
#
# Port/Interface: SimulationConfig (speed, fidelity, clock)
# Adapter: SimulationClock, SimulationApplicationBootstrap
#
# Real GitHub boards and tickets, simulated agents and containers.
# Useful for integration testing against real GitHub issues while keeping
# agent responses deterministic and fast.

name: mixed_github
description: Real GitHub boards and tickets, simulated agents and containers
version: "1.0"

# Fidelity level: MEDIUM = realistic timing with causal linking via events
fidelity: MEDIUM

# Simulation timing (nested under simulation: key)
simulation:
  speed_multiplier: 10.0
  start_time: null  # Current time
