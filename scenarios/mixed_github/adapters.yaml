# Mixed GitHub Scenario — Adapter Configuration
#
# Port/Interface: All output ports (IBoardService, ITicketSystem, ILLMProvider, …)
# Maps each port slot to its adapter implementation.
#
# Credentials Required:
#   GITHUB_TOKEN - Personal Access Token (repo, project scopes)
#   GITHUB_ORG   - GitHub organization name
#   GITHUB_REPO  - Repository in org/repo format

adapters:
  # Real GitHub adapters
  board: github          # IBoardService  → GitHubBoardAdapter
  ticket: github         # ITicketSystem  → GitHubTicketAdapter
  discussion_adapter: github     # IDiscussionAdapter → GitHubDiscussionAdapter
  review_cycle: github   # ICodeReviewService → GitHubCodeReviewAdapter
  work_item_service: github  # IWorkItemService → GitHubWorkItemAdapter
  identity_service: github   # IIdentityService → GitHubIdentityAdapter

  # Simulated/in-memory adapters
  llm: mock              # ILLMProvider → MockLLMAdapter (deterministic)
  container: fake        # IContainer → FakeContainerAdapter
  version_control: in_memory  # IVersionControlService → InMemoryVersionControlAdapter

  # Infrastructure adapters
  event_store: in_memory        # IEventStore → InMemoryEventStore
  message_broker: in_memory     # IMessageBroker → InMemoryMessageBroker
  lock_service: in_memory       # IPipelineLockService → InMemoryLockService

  # Configuration and storage
  config_store: in_memory       # IConfigStore → InMemoryConfigStore
  workflow_config: in_memory    # IWorkflowConfigService → InMemoryWorkflowConfigService
  storage: in_memory            # IStorage → InMemoryStorageAdapter

  # Observability and utility
  metrics: in_memory            # IMetricsAdapter → InMemoryMetricsAdapter
  notifier: mock                # INotifier → MockNotifier
  encryption: simple            # IEncryption → SimpleEncryption
  repair_cycle: mock            # IRepairCycleAdapter → MockRepairCycleAdapter
  project_manager: mock         # IProjectManager → MockProjectManager
  checkpoint_store: in_memory   # ICheckpointStore → InMemoryCheckpointStore
  agent_repository: in_memory   # IAgentRepository → InMemoryAgentRepository
  run_registry: in_memory       # IRunRegistry → InMemoryRunRegistry
  branch_tracker: in_memory     # IBranchTracker → InMemoryBranchTracker
  event_emitter: mock           # IEventEmitter → MockEventEmitter
  queue_service: in_memory      # IQueueService → InMemoryQueueService

scenario_config:
  adapter_overrides:
    - board
    - ticket
    - discussion_adapter
    - review_cycle
    - work_item_service
    - identity_service
  load_order:
    - default_simulation_config
    - scenario_adapters
    - environment_overrides
