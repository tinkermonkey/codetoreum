# Mixed GitHub Scenario — Container Configuration
#
# Port/Interface: IContainer (FakeContainerAdapter settings)
# Controls FakeContainerAdapter's simulated execution behaviour.

containers:
  default_exit_code: 0
  execution_delay: 0.1
  command_exit_codes:
    "pytest": 0
    "npm test": 0
    "black": 0
  command_outputs:
    "pytest": { stdout: "===== 42 passed in 0.12s =====", stderr: "" }
    "npm test": { stdout: "Test Suites: 1 passed, 1 total", stderr: "" }
