# Stress Test Scenario — Board Configuration
#
# Port/Interface: IBoardService, IWorkflowConfigService
# Adapter (sim): MockBoardAdapter, InMemoryWorkflowConfigService
#
# Minimal 3-column board for maximum throughput:
#   Backlog (manual) → In Progress (automated, worker, PIPELINE TRIGGER) → Done (exit)

boards:
  - board_id: "board-1"
    board_name: "Stress Test Board"
    columns:
      - "Backlog"
      - "In Progress"
      - "Done"
    column_configs:
      - name: "Backlog"
        type: "manual"
        is_pipeline_trigger: false
        is_exit_column: false
        auto_progress_on_completion: false

      - name: "In Progress"
        type: "automated"
        agent_id: "worker"
        is_pipeline_trigger: true
        is_exit_column: false
        auto_progress_on_completion: true
        sla_seconds: 300

      - name: "Done"
        type: "manual"
        is_pipeline_trigger: false
        is_exit_column: true
        auto_progress_on_completion: false

board_placements:
  - work_item_title: "Stress Test Task #1"
    column: "Backlog"
  - work_item_title: "Stress Test Task #2"
    column: "Backlog"
  - work_item_title: "Stress Test Task #3"
    column: "Backlog"
  - work_item_title: "Stress Test Task #4"
    column: "Backlog"
  - work_item_title: "Stress Test Task #5"
    column: "Backlog"
  - work_item_title: "Stress Test Task #6"
    column: "Backlog"
  - work_item_title: "Stress Test Task #7"
    column: "Backlog"
