# Review Cycle Scenario — Projects
#
# Port/Interface: ITicketSystem, IVersionControlService
# Adapter (sim): InMemoryTicketAdapter, InMemoryVersionControlAdapter

projects:
  - name: "review-cycle-project"
    description: "Project demonstrating review and feedback workflows"
    default_branch: "main"
    metadata:
      review_policy: "mandatory"
      approval_required: true
