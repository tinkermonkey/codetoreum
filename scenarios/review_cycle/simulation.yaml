  author: "codetoreum-team"
  review_rounds: "multiple"
  feedback_enabled: true
  tags:
    - "review"
    - "feedback"
    - "iterative"
    - "maker-checker"
    - "explicit-config"
  notes: |
    This scenario demonstrates the review and feedback loop functionality.
    Each work item should go through at least one feedback-revision cycle.
