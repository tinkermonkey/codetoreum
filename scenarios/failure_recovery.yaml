# Failure Recovery Scenario
#
# Scenario testing error handling, retries, and failure recovery mechanisms.
# Includes flaky agents, timeouts, and various failure modes.

name: "Failure Recovery Scenario"
description: "Scenario for testing error handling and recovery mechanisms"
version: "1.0"

# Simulation settings
speed_multiplier: 10.0
auto_advance: false

# Projects
projects:
  - name: "failure-recovery-project"
    description: "Project for testing failure scenarios and recovery"
    default_branch: "main"
    metadata:
      environment: "chaos_testing"
      retry_policy: "aggressive"

# Workflows
workflows:
  - name: "resilient-workflow"
    description: "Workflow designed to handle failures gracefully"
    stages:
      - name: "flaky-stage"
        agent_type: "flaky_agent"
        description: "Stage with intermittent failures"
        order: 1
        max_retries: 5
        timeout_seconds: 1800

      - name: "recovery-stage"
        agent_type: "recovery_agent"
        description: "Recovery and validation stage"
        order: 2
        max_retries: 3
        timeout_seconds: 1800

      - name: "timeout-prone-stage"
        agent_type: "slow_agent"
        description: "Stage that may timeout"
        order: 3
        max_retries: 2
        timeout_seconds: 600

      - name: "error-handling-stage"
        agent_type: "error_handler"
        description: "Final error handling and cleanup"
        order: 4
        max_retries: 1
        timeout_seconds: 900

# Agents
agents:
  - name: "flaky_agent"
    agent_type: "flaky"
    description: "Agent with 50% failure rate for testing retries"
    capabilities:
      - "code_generation"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 4096
    system_prompt: "You are an agent that occasionally fails. Simulate intermittent errors."
    enabled: true
    metadata:
      failure_rate: 0.5
      failure_types:
        - "network_error"
        - "timeout"
        - "invalid_response"
      simulated_errors: true

  - name: "recovery_agent"
    agent_type: "recovery"
    description: "Agent specialized in recovery and validation"
    capabilities:
      - "code_generation"
      - "code_review"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.6
    max_tokens: 4096
    system_prompt: "You are a recovery agent. Validate previous work and fix issues."
    enabled: true
    metadata:
      failure_rate: 0.0
      recovery_mode: true

  - name: "slow_agent"
    agent_type: "slow"
    description: "Agent with slow processing that may timeout"
    capabilities:
      - "code_generation"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.7
    max_tokens: 8192
    system_prompt: "You are a slow agent. Perform thorough but time-consuming work."
    enabled: true
    metadata:
      processing_delay: 550
      timeout_risk: "high"

  - name: "error_handler"
    agent_type: "error_handler"
    description: "Agent for error handling and cleanup"
    capabilities:
      - "code_review"
    llm_model: "claude-3-5-sonnet-20241022"
    temperature: 0.5
    max_tokens: 2048
    system_prompt: "You are an error handler. Clean up and validate final state."
    enabled: true
    metadata:
      failure_rate: 0.0
      cleanup_mode: true

# Work Items
work_items:
  - title: "Task with retry scenario"
    description: |
      Work item that will encounter failures and require retries.

      Expected behavior:
      - Initial attempt fails
      - Retry succeeds after 2-3 attempts
      - System logs retry attempts
    labels:
      - "failure-test"
      - "retry"
    priority: "high"
    status: "new"
    metadata:
      expected_retries: 3
      failure_mode: "intermittent"

  - title: "Task with timeout scenario"
    description: |
      Work item that may timeout due to slow processing.

      Expected behavior:
      - First attempt times out
      - Retry with increased timeout succeeds
      - Timeout properly logged
    labels:
      - "failure-test"
      - "timeout"
    priority: "high"
    status: "new"
    metadata:
      expected_timeout: true
      timeout_stage: "timeout-prone-stage"

  - title: "Task with permanent failure"
    description: |
      Work item that fails permanently after max retries.

      Expected behavior:
      - All retries exhausted
      - Workflow moves to error handling
      - Failure properly recorded
    labels:
      - "failure-test"
      - "permanent-failure"
    priority: "medium"
    status: "new"
    metadata:
      expected_outcome: "failed"
      max_retries_expected: true

  - title: "Task with recovery scenario"
    description: |
      Work item that fails but recovers in recovery stage.

      Expected behavior:
      - Initial stage fails
      - Recovery stage detects and fixes issues
      - Successfully completes
    labels:
      - "failure-test"
      - "recovery"
    priority: "high"
    status: "new"
    metadata:
      recovery_expected: true
      final_state: "completed"

  - title: "Task with cascading failures"
    description: |
      Work item experiencing multiple types of failures.

      Expected behavior:
      - Multiple different error types
      - Different retry strategies applied
      - Comprehensive error logging
    labels:
      - "failure-test"
      - "cascading"
      - "complex"
    priority: "medium"
    status: "new"
    metadata:
      failure_types:
        - "network"
        - "timeout"
        - "validation"
      recovery_strategy: "multi-stage"

# Boards
boards:
  - board_id: "board-1"
    board_name: "Failure Recovery Board"
    columns: ["Backlog", "Ready", "In Progress", "Review", "Done"]

# Board placements
board_placements:
  - work_item_title: "Task with retry scenario"
    column: "Backlog"
  - work_item_title: "Task with timeout scenario"
    column: "Backlog"
  - work_item_title: "Task with permanent failure"
    column: "Backlog"
  - work_item_title: "Task with recovery scenario"
    column: "Backlog"
  - work_item_title: "Task with cascading failures"
    column: "Backlog"

# Additional metadata
metadata:
  scenario_type: "chaos_testing"
  author: "codetoreum-team"
  failure_modes:
    - "intermittent_failures"
    - "timeouts"
    - "permanent_failures"
    - "recovery_scenarios"
  tags:
    - "failure"
    - "recovery"
    - "retry"
    - "error-handling"
    - "chaos"
  notes: |
    This scenario tests the system's resilience and error handling capabilities.
    Agents are configured to simulate various failure modes:
    - Flaky agent: 50% failure rate
    - Slow agent: Timeout prone
    - Recovery agent: Always succeeds
    - Error handler: Cleanup and validation

    Expected outcomes:
    - Most tasks should eventually succeed after retries
    - One task should fail permanently
    - All failures should be properly logged and handled
