- type: add
  elementId: data-model.schemadefinition.commit-policy
  layerName: data-model
  after:
    id: d4be3d5e-b82f-4cef-bb81-30611744b998
    path: data-model.schemadefinition.commit-policy
    spec_node_id: data-model.schemadefinition
    type: schemadefinition
    layer_id: data-model
    name: CommitPolicy
    description: Enum declaring what an agent does with file changes it produces.
      NONE = analysis/comment-only agents that skip commit entirely. ON_SUCCESS
      = code-producing agents that commit and push only on container exit 0.
      ALWAYS = partial-progress agents that checkpoint even on failure. Controls
      ExecutionService commit behavior.
    attributes:
      title: CommitPolicy
      type: string
      enum:
        - none
        - on_success
        - always
    source_reference:
      provenance: extracted
      locations:
        - file: src/codetoreum/domain/value_objects.py
          symbol: CommitPolicy
    metadata:
      created_at: 2026-05-09T09:27:50.907Z
      updated_at: 2026-05-09T09:27:50.907Z
      version: 1
  timestamp: 2026-05-09T09:27:50.932Z
