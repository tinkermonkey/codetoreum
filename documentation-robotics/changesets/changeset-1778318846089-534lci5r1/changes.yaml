- type: add
  elementId: data-model.schemadefinition.type-safe-id
  layerName: data-model
  after:
    id: ed3a071d-f543-4a31-b794-ddd9c3000694
    path: data-model.schemadefinition.type-safe-id
    spec_node_id: data-model.schemadefinition
    type: schemadefinition
    layer_id: data-model
    name: TypeSafeId
    description: Generic base class for type-safe domain identifiers. Wraps a
      non-empty string value with type-level discrimination to prevent passing
      wrong ID types (e.g., WorkItemId where AgentId is expected). Provides
      generate() and from_string() factory methods. All typed ID subclasses
      inherit from this base.
    attributes:
      title: TypeSafeId
      type: object
    source_reference:
      provenance: extracted
      locations:
        - file: src/codetoreum/domain/value_objects.py
          symbol: TypeSafeId
    metadata:
      created_at: 2026-05-09T09:27:32.940Z
      updated_at: 2026-05-09T09:27:32.940Z
      version: 1
  timestamp: 2026-05-09T09:27:32.962Z
