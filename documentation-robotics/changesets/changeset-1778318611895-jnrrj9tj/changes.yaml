- type: add
  elementId: apm.metricinstrument.circuit-breaker-state-metrics
  layerName: apm
  after:
    id: 0fbdd877-4ec7-4729-b5fb-ec2beaabe3b7
    path: apm.metricinstrument.circuit-breaker-state-metrics
    spec_node_id: apm.metricinstrument
    type: metricinstrument
    layer_id: apm
    name: CircuitBreaker State Metrics
    description: Metric instrument tracking circuit breaker state transitions
      (CLOSED/OPEN/HALF_OPEN) and failure counts for external service calls.
      Records total_calls, total_failures, total_successes, and current state
      per service. Used for resilience observability and detecting cascading
      failures.
    attributes:
      type: ObservableGauge
      unit: state
    source_reference:
      provenance: extracted
      locations:
        - file: src/codetoreum/infrastructure/resilience/circuit_breaker.py
          symbol: CircuitBreaker
    metadata:
      created_at: 2026-05-09T09:23:40.994Z
      updated_at: 2026-05-09T09:23:40.994Z
