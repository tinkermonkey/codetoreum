- type: add
  elementId: motivation.constraint.domain-events-must-be-immutable
  layerName: motivation
  after:
    id: e6466302-6ad2-4768-a246-72c5793fde39
    path: motivation.constraint.domain-events-must-be-immutable
    spec_node_id: motivation.constraint
    type: constraint
    layer_id: motivation
    name: Domain Events Must Be Immutable
    description: "All domain event classes must be immutable frozen dataclasses. No
      field may be mutated after construction. This guarantees audit integrity:
      an event in the store is always the exact record of the state change that
      occurred."
    attributes:
      constraintType: technical
      documentation: Enforced via @dataclass(frozen=True) on all 165 event classes in
        domain/events/. Serialization support is provided without mutation.
    source_reference:
      provenance: extracted
      locations:
        - file: src/codetoreum/domain/events/
          symbol: DomainEvent
