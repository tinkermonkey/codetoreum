          type: string
        project_id:
          type: string
        maker_agent:
          type: string
        reviewer_agent:
          type: string
        max_iterations:
          type: integer
        iteration:
          type: integer
        status:
          type: string
        blocking_count:
          type: integer
        escalation_reason:
          type: string
        feedback:
          type: string
