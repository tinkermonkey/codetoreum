    name: Review Cycle Events
    description: "Domain events for maker-checker review cycle lifecycle:
      ReviewCycleStartedEvent (review_cycle_id, work_item_id, project_id,
      maker_agent, reviewer_agent, max_iterations),
      ReviewCycleIterationCompletedEvent (iteration, status, blocking_count),
      ReviewCycleMakerRevisionEvent, ReviewCycleEscalatedToHumanEvent
      (blocking_count, escalation_reason), ReviewCycleHumanFeedbackReceivedEvent
      (feedback), ReviewCycleMaxIterationsReachedEvent, ReviewCycleApprovedEvent
      (total_iterations). 7 event classes; emitted by ReviewService."
    attributes:
      type: object
      properties:
        event_id:
          type: string
