    spec_node_id: security.threat
    type: threat
    layer_id: security
    name: Unauthorized Agent Privilege Escalation
    description: "A containerized AI agent attempts to access the host Docker socket
      (e.g., via a mounted /var/run/docker.sock) to spawn new containers or
      escape isolation. Mitigated by the container isolation policy: Docker
      socket is explicitly not mounted into agent containers."
    attributes:
      threatens: Container Isolation
      likelihood: low
      impact: high
      criticality: high
    source_reference:
      provenance: extracted
      locations:
