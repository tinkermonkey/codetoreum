Datastore Architecture Index:
  id: datastore.index.overview
  name: Datastore Architecture Index
  database:
    name: codetoreum-datastore-index
    schemas:
    - name: overview
      tables:
      - columns:
        - dataType: string
          name: name
        - dataType: string
          name: reference
        - dataType: string
          name: purpose
        name: datastore-components
    type: Elasticsearch
  documentation: 'Overview of Codetoreum''s data persistence layer.


    Architecture Decisions:

    - No traditional RDBMS (PostgreSQL removed in Gen 2)

    - Event sourcing via Elasticsearch for complete audit trail

    - Redis for caching and real-time messaging

    - All state changes emit domain events


    Data Flow:

    1. Domain entities emit events on state changes

    2. Events stored in Elasticsearch event store

    3. Configuration cached in Redis for fast access

    4. WebSocket updates distributed via Redis pub/sub


    Resilience Patterns Applied:

    - Circuit breaker on Elasticsearch connections

    - Rate limiting on API operations

    - Retry with exponential backoff

    - Timeout on all external calls

    '
  components:
  - file: elasticsearch.yaml
    name: Elasticsearch Event Store
    purpose: Event sourcing and audit trail
    reference: datastore.database.event-store
  - file: elasticsearch.yaml
    name: Elasticsearch Config Storage
    purpose: Configuration versioning and search
    reference: datastore.database.config-storage
  - file: redis.yaml
    name: Redis Cache
    purpose: Caching, pub/sub, session management
    reference: datastore.database.redis-cache
  x-governed-by-constraints: '[''motivation.constraint.elasticsearch-redis-stack'',
    ''motivation.constraint.eventual-consistency'', ''motivation.constraint.event-emission-required'']'
Audit Database:
  database.type: postgresql
  description: PostgreSQL database for comprehensive audit logging with 7-year retention
  id: datastore.database.audit-database
  name: Audit Database
  database:
    name: codetoreum_audit
    schemas:
    - name: public
      tables:
      - name: audit_events
        documentation: Stores all system audit events with full context for compliance and security tracking
        columns:
        - name: id
          dataType: uuid
          nullable: false
          primaryKey: true
          description: Unique identifier for audit event
          defaultValue: gen_random_uuid()

        - name: timestamp
          dataType: timestamp with time zone
          nullable: false
          description: Event occurrence timestamp in UTC
          defaultValue: now()

        - name: event_type
          dataType: varchar(100)
          nullable: false
          description: Type of audit event (user.login, agent.execution.started, etc.)

        - name: user_id
          dataType: varchar(255)
          nullable: true
          description: User identifier (null for system-initiated events)

        - name: actor_id
          dataType: varchar(255)
          nullable: true
          description: Actor performing the action (user, agent, system component)

        - name: resource_type
          dataType: varchar(100)
          nullable: true
          description: Type of resource affected (work_item, agent, workflow, config, etc.)

        - name: resource_id
          dataType: varchar(255)
          nullable: true
          description: Unique identifier of affected resource

        - name: action
          dataType: varchar(50)
          nullable: false
          description: Action performed (create, read, update, delete, execute, approve, reject)

        - name: result
          dataType: varchar(20)
          nullable: false
          description: Result of action (success, failure, denied)
          defaultValue: "'success'"

        - name: details
          dataType: jsonb
          nullable: true
          description: Event-specific details and context in JSON format

        - name: metadata
          dataType: jsonb
          nullable: true
          description: Additional metadata (request_id, correlation_id, session_id, etc.)

        - name: ip_address
          dataType: inet
          nullable: true
          description: Source IP address of request (null for system events)

        - name: user_agent
          dataType: text
          nullable: true
          description: HTTP user agent string (for API requests)

        - name: severity
          dataType: varchar(20)
          nullable: false
          description: Event severity level (info, warning, error, critical)
          defaultValue: "'info'"

        constraints:
        - name: audit_events_pkey
          type: PRIMARY_KEY
          columns:
            - id

        - name: audit_events_event_type_check
          type: CHECK
          expression: event_type ~ '^[a-z0-9_.]+$'
          description: Ensure event_type follows naming convention

        - name: audit_events_action_check
          type: CHECK
          expression: action IN ('create', 'read', 'update', 'delete', 'execute', 'approve', 'reject', 'login', 'logout')

        - name: audit_events_result_check
          type: CHECK
          expression: result IN ('success', 'failure', 'denied', 'partial')

        - name: audit_events_severity_check
          type: CHECK
          expression: severity IN ('debug', 'info', 'warning', 'error', 'critical')

        indices:
        - name: idx_audit_events_timestamp
          type: btree
          columns:
            - timestamp DESC
          description: Primary index for time-based queries and partitioning

        - name: idx_audit_events_event_type
          type: btree
          columns:
            - event_type
          description: Index for filtering by event type

        - name: idx_audit_events_user_id
          type: btree
          columns:
            - user_id
          where: user_id IS NOT NULL
          description: Index for user activity tracking

        - name: idx_audit_events_resource
          type: btree
          columns:
            - resource_type
            - resource_id
          where: resource_id IS NOT NULL
          description: Composite index for resource-based queries

        - name: idx_audit_events_actor
          type: btree
          columns:
            - actor_id
          where: actor_id IS NOT NULL
          description: Index for actor-based audit trails

        - name: idx_audit_events_result
          type: btree
          columns:
            - result
          where: result != 'success'
          description: Partial index for failed/denied events

        - name: idx_audit_events_details_gin
          type: gin
          columns:
            - details
          description: GIN index for JSONB details field queries

        - name: idx_audit_events_metadata_gin
          type: gin
          columns:
            - metadata
          description: GIN index for JSONB metadata field queries

        partitioning:
          strategy: range
          column: timestamp
          type: monthly
          retention: 84 months
          description: Monthly partitions with 7-year (84-month) retention policy for compliance
          automation: pg_partman extension for automatic partition management

    type: PostgreSQL

  x-security-control-ref: security.control.audit-logging
  x-retention-policy: 7 years (compliance requirement)
  x-backup-strategy: Daily incremental, weekly full backups to S3
  x-replication: Streaming replication with 2 standby replicas for high availability
