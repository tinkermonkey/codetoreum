Elasticsearch Event Store:
  id: datastore.database.event-store
  name: Elasticsearch Event Store
  documentation: 'Production event store using Elasticsearch for event sourcing.

    Features monthly index rollover, optimistic concurrency control,

    and full-text search capabilities.

    '
  database:
    name: codetoreum-events
    type: Elasticsearch
    version: 8.0+
    metadata:
      x-owner: codetoreum-platform
      x-purpose: Event sourcing and audit trail
      x-resilience: Circuit breaker, rate limiting, retry, timeout
    schemas:
    - name: events
      tables:
      - name: events-monthly
        columns:
        - name: event_id
          dataType: keyword
        - name: aggregate_id
          dataType: keyword
        - name: aggregate_type
          dataType: keyword
        - name: event_type
          dataType: keyword
        - name: timestamp
          dataType: date
        - name: data
          dataType: object
    indices:
    - name: events-{YYYY.MM}
      documentation: Monthly event indices with automatic rollover
      metadata:
        x-owner: event-store-service
        x-retention: configurable-via-ilm
        x-rollover: monthly
      settings:
        number_of_shards: 2
        number_of_replicas: 1
        refresh_interval: 5s
      mappings:
        properties:
          event_id:
            type: keyword
            documentation: Unique event identifier (UUID)
          aggregate_id:
            type: keyword
            documentation: ID of the aggregate that emitted this event
          aggregate_type:
            type: keyword
            documentation: Type of aggregate (WorkItem, Agent, Workflow, etc.)
          event_type:
            type: keyword
            documentation: Event type name (WorkItemCreated, etc.)
          event_version:
            type: integer
            documentation: Event schema version for evolution
          timestamp:
            type: date
            documentation: When event occurred (ISO 8601)
          stream_version:
            type: long
            documentation: Sequence number within the aggregate's event stream
          correlation_id:
            type: keyword
            documentation: ID to group related events across aggregates
          causation_id:
            type: keyword
            documentation: ID of the event that caused this event
          user_id:
            type: keyword
            documentation: ID of user who triggered this event
          data:
            type: object
            enabled: true
            documentation: Event-specific payload data
          metadata:
            properties:
              trace_id:
                type: keyword
                documentation: OpenTelemetry trace ID
              span_id:
                type: keyword
                documentation: OpenTelemetry span ID
              service:
                type: keyword
                documentation: Service that emitted the event
  uses-technology:
  - technology.systemsoftware.elasticsearch
  stored-schemas:
  - data_model.schema.domain-event
Elasticsearch Configuration Storage:
  id: datastore.database.config-storage
  name: Elasticsearch Configuration Storage
  documentation: 'Production configuration storage using Elasticsearch.

    Features separate indices for each configuration type,

    optimistic concurrency control, full-text search,

    and configuration versioning with audit trail.

    '
  database:
    name: codetoreum-config
    type: Elasticsearch
    version: 8.0+
    metadata:
      x-owner: codetoreum-platform
      x-purpose: Configuration storage and versioning
      x-resilience: Circuit breaker, rate limiting, retry, timeout
    schemas:
    - name: config
      tables:
      - name: config-projects
        columns:
        - name: id
          dataType: keyword
        - name: name
          dataType: text
        - name: github_org
          dataType: keyword
        - name: github_repo
          dataType: keyword
        - name: version
          dataType: integer
      - name: config-agents
        columns:
        - name: project_id
          dataType: keyword
        - name: agent_name
          dataType: text
        - name: model
          dataType: keyword
        - name: version
          dataType: integer
      - name: config-pipelines
        columns:
        - name: id
          dataType: keyword
        - name: project_id
          dataType: keyword
        - name: name
          dataType: text
        - name: version
          dataType: integer
      - name: config-workflows
        columns:
        - name: id
          dataType: keyword
        - name: name
          dataType: text
        - name: version
          dataType: integer
      - name: config-history
        columns:
        - name: config_id
          dataType: keyword
        - name: config_type
          dataType: keyword
        - name: version
          dataType: integer
        - name: changed_at
          dataType: date
    indices:
    - name: config-projects
      documentation: Project-level configuration including repository and environment
        settings
      metadata:
        x-owner: configuration-service
        x-retention: indefinite
      settings:
        number_of_shards: 1
        number_of_replicas: 1
      mappings:
        properties:
          id:
            type: keyword
          name:
            type: text
            analyzer: config_analyzer
            fields:
              keyword:
                type: keyword
          github_org:
            type: keyword
          github_repo:
            type: keyword
          tech_stacks:
            type: object
            enabled: true
          pipelines:
            type: nested
          testing:
            type: object
            enabled: true
          environment_variables:
            type: object
            enabled: true
          mounted_commands:
            type: object
            enabled: true
          mounted_subagents:
            type: object
            enabled: true
          created_at:
            type: date
          updated_at:
            type: date
          version:
            type: integer
          metadata:
            type: object
            enabled: true
    - name: config-agents
      documentation: Agent-specific configuration within a project
      metadata:
        x-owner: configuration-service
        x-retention: indefinite
      settings:
        number_of_shards: 1
        number_of_replicas: 1
      mappings:
        properties:
          project_id:
            type: keyword
          agent_name:
            type: text
            analyzer: config_analyzer
            fields:
              keyword:
                type: keyword
          model:
            type: keyword
          timeout:
            type: integer
          requires_docker:
            type: boolean
          makes_code_changes:
            type: boolean
          mcp_servers:
            type: keyword
          capabilities:
            type: keyword
          constraints:
            type: object
            enabled: true
          version:
            type: integer
          created_at:
            type: date
          updated_at:
            type: date
          metadata:
            type: object
            enabled: true
    - name: config-pipelines
      documentation: Pipeline configuration for workflow execution
      metadata:
        x-owner: configuration-service
        x-retention: indefinite
      settings:
        number_of_shards: 1
        number_of_replicas: 1
      mappings:
        properties:
          id:
            type: keyword
          project_id:
            type: keyword
          name:
            type: text
            analyzer: config_analyzer
            fields:
              keyword:
                type: keyword
          stages:
            type: nested
          triggers:
            type: keyword
          version:
            type: integer
          created_at:
            type: date
          updated_at:
            type: date
          metadata:
            type: object
            enabled: true
    - name: config-workflows
      documentation: Workflow template definitions
      metadata:
        x-owner: configuration-service
        x-retention: indefinite
      settings:
        number_of_shards: 1
        number_of_replicas: 1
      mappings:
        properties:
          id:
            type: keyword
          name:
            type: text
            analyzer: config_analyzer
            fields:
              keyword:
                type: keyword
          display_name:
            type: text
          description:
            type: text
            analyzer: config_analyzer
          stage_templates:
            type: nested
          version:
            type: integer
          is_default:
            type: boolean
          applicable_labels:
            type: keyword
          created_at:
            type: date
          updated_at:
            type: date
          metadata:
            type: object
            enabled: true
    - name: config-history
      documentation: Configuration change audit trail for versioning and rollback
      metadata:
        x-owner: configuration-service
        x-retention: 365d
      settings:
        number_of_shards: 1
        number_of_replicas: 1
      mappings:
        properties:
          config_id:
            type: keyword
          config_type:
            type: keyword
            documentation: Type of configuration (project, agent, pipeline, workflow)
          version:
            type: integer
          changed_at:
            type: date
          changed_by:
            type: keyword
          change_type:
            type: keyword
            documentation: Type of change (create, update, delete)
          changes:
            type: object
            enabled: true
          reason:
            type: text
          snapshot:
            type: object
            enabled: true
            documentation: Full configuration snapshot at this version
  uses-technology:
  - technology.systemsoftware.elasticsearch
  stored-schemas:
  - data_model.schema.project-context
  - data_model.schema.workflow-template
  - data_model.schema.agent-config
  - data_model.schema.project-config
