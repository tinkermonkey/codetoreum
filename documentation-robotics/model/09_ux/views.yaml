Authentication Required Screen:
  id: ux.screen.auth-required
  name: Authentication Required Screen
  type: screen
  version: 1.0.0
  channel: visual
  views:
  - description: Step-by-step guide for authenticating with server token
    name: auth-instructions
    title: Authentication Instructions
    type: detail
  documentation: 'Landing page shown when user is not authenticated.


    Purpose: Guide users to authenticate using server-generated token.


    Content:

    - Authentication required message

    - Step-by-step authentication instructions

    - Example server output showing access URL

    - Security note about single-tenant model


    Location: frontend/src/pages/AuthRequiredPage.tsx

    '
  route: navigation.route.auth-required
  supportsGoals:
  - motivation.goal.security
  - motivation.goal.ease-of-configuration
  usesAuthScheme:
  - security.authentication.query-param-auth
  usesApiOperations: []
  properties:
    screen.component: AuthRequiredPage
    screen.icons: AlertCircle, Terminal
    screen.public: 'true'
  experience: visual
  states:
  - name: default
    initial: true
    description: Default state
Dashboard Screen:
  id: ux.screen.dashboard
  name: Dashboard Screen
  type: screen
  version: 1.0.0
  channel: visual
  views:
  - name: work-items-overview
    title: Active Work Items
    type: dashboard
    components:
    - name: work-items-list
      type: list
      dataBinding:
        dataSource: api.operation.list-work-items
  - name: executions-overview
    title: Recent Executions
    type: list
    components:
    - name: executions-list
      type: list
      dataBinding:
        dataSource: api.operation.list-executions
  documentation: 'Main dashboard showing system overview with real-time updates.


    Sections:

    1. Active Work Items - List of current work items with status

    2. Recent Executions - Latest agent execution summaries

    3. Real-time Events - WebSocket event feed (last 10 events)

    4. Connection Status - Live indicator (green pulse when connected)


    Features:

    - Real-time WebSocket updates for execution events

    - Status-based color coding (green/blue/red/yellow)

    - Time formatting with date-fns

    - Responsive grid layout


    Data sources:

    - GET /api/v2/work-items (limit 20)

    - GET /api/v2/executions (limit 10)

    - WebSocket /api/v2/events/stream


    Location: frontend/src/pages/DashboardPage.tsx

    '
  route: navigation.route.root
  supportsGoals:
  - motivation.goal.observability
  - motivation.goal.ease-of-configuration
  usesApiOperations:
  - api.operation.list-work-items
  - api.operation.list-executions
  properties:
    screen.component: DashboardPage
    screen.icons: Activity, Clock, CheckCircle2, XCircle, Loader2
    screen.requires-auth: 'true'
    screen.websocket: 'true'
  experience: visual
  states:
  - description: Default state
    initial: true
    name: default
  api-refs: '["api.operation.list-work-items"]'
  route-ref: navigation.route.root
