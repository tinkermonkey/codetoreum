Authentication Store:
  id: ux.store.auth-store
  name: Authentication Store
  type: state-store
  documentation: 'Zustand store for authentication state.


    State:

    - isAuthenticated: boolean

    - isLoading: boolean (starts true)

    - error: string | null

    - lastAuthTime: number | null


    Actions:

    - setAuthenticated(boolean)

    - setLoading(boolean)

    - setError(string | null)

    - clearAuth()


    Security:

    - No token stored (httpOnly cookies)

    - No persistence (validates on each load)

    - Global event listener for ''auth:unauthorized''


    Location: frontend/src/store/authStore.ts

    '
  supportsGoals:
  - motivation.goal.security
  properties:
    store.framework: zustand
    store.persistence: none
  version: 1.0.0
  experience: visual
  channel: visual
  states:
  - name: default
    initial: true
  views:
  - name: default
    type: custom
WebSocket Store:
  id: ux.store.websocket-store
  name: WebSocket Store
  type: state-store
  documentation: 'Zustand store for singleton WebSocket connection.


    State:

    - ws: WebSocket | null

    - isConnected: boolean

    - isConnecting: boolean

    - error: string | null

    - reconnectAttempt: number

    - events: WebSocketEvent[] (last 100)

    - subscriptions: Set<string>


    Actions:

    - connect(isAuthenticated)

    - disconnect()

    - subscribe(eventType)

    - unsubscribe(eventType)

    - clearEvents()

    - reconnect()


    Features:

    - Singleton connection across app

    - Exponential backoff reconnection

    - Event buffering (last 100)

    - Subscription management

    - Cookie-based authentication


    Location: frontend/src/store/websocketStore.ts

    '
  supportsGoals:
  - motivation.goal.observability
  usesAuthScheme:
  - security.authentication.websocket-auth
  properties:
    store.framework: zustand
    store.event-buffer: '100'
    store.max-reconnect-attempts: '10'
  version: 1.0.0
  experience: visual
  channel: visual
  states:
  - name: default
    initial: true
  views:
  - name: default
    type: custom
useAuth Hook:
  id: ux.hook.use-auth
  name: useAuth Hook
  type: hook
  documentation: 'Authentication hook for managing auth state and flow.


    Returns:

    - isAuthenticated: boolean

    - isLoading: boolean

    - error: string | null

    - logout: () => Promise<void>


    Flow:

    1. Check for token in URL query parameter

    2. If found, exchange for httpOnly cookie

    3. Remove token from URL

    4. Validate existing cookie via /v2/auth/token-info

    5. Update auth store state


    Features:

    - Single initialization across components

    - URL token cleanup

    - Error handling


    Location: frontend/src/hooks/useAuth.ts

    '
  usesAuthScheme:
  - security.authentication.httponly-cookie-auth
  - security.authentication.query-param-auth
  properties:
    hook.singleton-init: 'true'
  version: 1.0.0
  experience: visual
  channel: visual
  states:
  - name: default
    initial: true
  views:
  - name: default
    type: custom
useWebSocket Hook:
  id: ux.hook.use-websocket
  name: useWebSocket Hook
  type: hook
  documentation: 'WebSocket hook wrapping the Zustand store.


    Parameters:

    - isAuthenticated: boolean

    - isAuthLoading: boolean (default false)

    - config: WebSocketConfig (optional)


    Returns:

    - isConnected: boolean

    - isConnecting: boolean

    - error: string | null

    - events: WebSocketEvent[]

    - reconnectAttempt: number

    - subscribe: (eventType) => void

    - unsubscribe: (eventType) => void

    - clearEvents: () => void

    - reconnect: () => void

    - disconnect: () => void


    Features:

    - Waits for auth to complete before connecting

    - Wraps Zustand store for backward compatibility

    - Automatic cleanup on unmount


    Location: frontend/src/hooks/useWebSocket.ts

    '
  usesAuthScheme:
  - security.authentication.websocket-auth
  properties:
    hook.wraps-store: websocketStore
  version: 1.0.0
  experience: visual
  channel: visual
  states:
  - name: default
    initial: true
  views:
  - name: default
    type: custom
Authenticate User:
  id: ux.interaction.authenticate
  name: Authenticate User
  type: interaction
  documentation: 'User authentication flow via URL token.


    Steps:

    1. User receives access URL from server console

    2. User opens URL in browser

    3. App detects token in query parameter

    4. App exchanges token for httpOnly cookie

    5. URL is cleaned (token removed)

    6. User is authenticated and sees dashboard

    '
  triggeredBy: url-access
  invokesScreen:
  - ux.screen.dashboard
  properties:
    interaction.entry-point: query-parameter
    interaction.success-redirect: /
  version: 1.0.0
  experience: visual
  channel: visual
  states:
  - name: default
    initial: true
  views:
  - name: default
    type: custom
