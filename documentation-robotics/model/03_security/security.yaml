Frontend Authentication State:
  id: security.data-protection.frontend-auth-state
  name: Frontend Authentication State
  type: data-protection
  version: 1.0.0
  documentation: 'Secure authentication state management in React frontend.


    Design principles:

    - No token stored in state or localStorage

    - Only authentication status tracked (boolean)

    - Zustand store without persistence (validated on each load)

    - Cookie validation via /v2/auth/token-info endpoint


    Unauthorized handling:

    - Custom ''auth:unauthorized'' window event

    - Automatic state clearing on 401

    - Redirect to AuthRequiredPage


    URL token handling:

    - Token in URL immediately exchanged for cookie

    - URL cleaned via history.replaceState()

    - Prevents browser history exposure

    '
  supportsGoals:
  - motivation.goal.security
  properties:
    protection.no-localstorage: 'true'
    protection.no-token-in-state: 'true'
    protection.url-token-cleanup: 'true'
  application: codetoreum
  authentication:
    provider: session
    sessionTimeout: 30
  roles:
  - description: Standard user role
    displayName: User Role
    name: user
  resources:
  - description: API resources
    operations:
