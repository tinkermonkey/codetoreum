Circuit Breaker Control:
  id: security.control.circuit-breaker
  name: Circuit Breaker Control
  type: security-control
  version: 1.0.0
  documentation: 'Prevents cascading failures when external services are unhealthy.


    States:

    - CLOSED: Normal operation, requests pass through

    - OPEN: Service unhealthy, requests fail fast

    - HALF_OPEN: Testing recovery with limited requests


    Transitions:

    - CLOSED -> OPEN: After failure_threshold consecutive failures

    - OPEN -> HALF_OPEN: After timeout_seconds elapsed

    - HALF_OPEN -> CLOSED: After success_threshold consecutive successes

    - HALF_OPEN -> OPEN: On any failure


    Default configuration:

    - failure_threshold: 5

    - timeout_seconds: 60

    - success_threshold: 2

    '
  controlType: preventive
  supportsGoals:
  - motivation.goal.resilience
  - motivation.goal.security
  properties:
    control.failure-threshold: '5'
    control.implementation: CircuitBreaker
    control.success-threshold: '2'
    control.timeout-seconds: '60'
  application: codetoreum
  authentication:
    provider: session
    sessionTimeout: 30
  roles:
  - description: Standard user role
    displayName: User Role
    name: user
  resources:
  - description: API resources
    operations:
    - description: Default access operation
      operation: access
    resource: api
