  displayName: Circuit Breaker Control
Container Isolation Control:
  id: security.control.container-isolation
  name: Container Isolation Control
  type: security-control
  version: 1.0.0
  documentation: 'Security sandbox for AI agent execution in Docker containers.


    Agent containers have:

    - Internet access (for research/downloads)

    - Mounted project files (read/write or read-only as configured)

    - Project-level environment variables

    - MCP servers for artifacts and logging


    Agent containers DO NOT have:

    - Git credentials or SSH keys

    - GitHub credentials or app keys

    - Docker socket access

    - Host filesystem access beyond mounts


    Critical security implication:

    Orchestrator handles ALL git operations (clone, commit, push).

    Agents work on pre-checked-out code.

    '
  controlType: preventive
  supportsGoals:
  - motivation.goal.security
  governedByConstraints:
  - motivation.constraint.no-git-credentials
  - motivation.constraint.orchestrator-git-control
  properties:
    control.docker-socket: 'false'
    control.git-credentials: 'false'
    control.internet-access: 'true'
    control.mcp-servers: 'true'
  application: codetoreum
  authentication:
    provider: session
    sessionTimeout: 30
  roles:
  - description: Standard user role
    displayName: User Role
    name: user
  resources:
  - description: API resources
    operations:
