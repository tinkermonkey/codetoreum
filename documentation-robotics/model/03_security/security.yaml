WebSocket Authentication:
  id: security.authentication.websocket-auth
  name: WebSocket Authentication
  type: authentication
  version: 1.0.0
  documentation: 'Authentication for WebSocket real-time event streaming.


    Mechanism:

    - Browser sends httpOnly cookies automatically on WebSocket upgrade

    - Backend validates cookie during connection handshake

    - Close code 4001 indicates authentication failure


    Reconnection behavior:

    - Exponential backoff (1s, 2s, 4s, 8s, 16s, 30s max)

    - Max 10 reconnection attempts

    - No reconnection on 4001 (Unauthorized)

    '
  scheme: cookie
  supportsGoals:
  - motivation.goal.security
  realizedBy:
  - application.service.authentication-service
  properties:
    auth.close-code-unauthorized: '4001'
    auth.max-reconnect-attempts: '10'
    auth.max-reconnect-delay-ms: '30000'
  application: codetoreum
  authentication:
    provider: session
    sessionTimeout: 30
  roles:
