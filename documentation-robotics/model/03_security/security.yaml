JWT Token Authentication:
  id: security.authentication.jwt-token-auth
  name: JWT Token Authentication
  type: authentication
  version: 1.0.0
  documentation: 'Primary authentication mechanism using JSON Web Tokens (JWT) with
    HS256 signing.

    Single-tenant, JupyterLab-style token generated at server startup.


    Token characteristics:

    - Generated using python-jose library

    - Signed with CODETOREUM_SECRET_KEY (required in production)

    - Default expiry: 365 days (configurable via CODETOREUM_TOKEN_EXPIRATION_DAYS)

    - Subject: "codetoreum-server"

    - Type: "access"


    Migration path: Designed to be replaced with multi-user JWT system in future.

    '
  scheme: bearer
  supportsGoals:
  - motivation.goal.security
  realizedBy:
  - application.service.authentication-service
  properties:
    auth.algorithm: HS256
    auth.production-requirement: CODETOREUM_SECRET_KEY must be set
    auth.secret-key-length: 64 bytes URL-safe
    auth.token-expiry-days: '365'
  application: codetoreum
  authentication:
    provider: jwt
    sessionTimeout: 60
  roles:
  - description: Standard user role
    displayName: User Role
    name: user
  resources:
  - description: API resources
    operations:
    - description: Default access operation
      operation: access
    resource: api
    type: api
  dataClassification:
    classifications:
    - accessControl: role-based
      auditLevel: standard
      description: Internal data not for public release
      encryption: at-rest
      label: Internal Data
      level: internal
      retention:
        deleteAfter: false
        period: 1y
        reviewRequired: false
  displayName: JWT Token Authentication
HttpOnly Cookie Authentication:
  id: security.authentication.httponly-cookie-auth
  name: HttpOnly Cookie Authentication
  type: authentication
  version: 1.0.0
  documentation: 'Secure browser session authentication using httpOnly cookies.

    Primary mechanism for web UI after initial token exchange.


    Cookie attributes:

    - Name: codetoreum_token

    - HttpOnly: true (prevents JavaScript access, XSS protection)

    - SameSite: Strict (CSRF protection)

    - Secure: true in production (HTTPS only)

    - Max-Age: 1 year

    - Path: /


    Flow:

    1. User receives access URL with token query parameter

    2. First request exchanges token for httpOnly cookie

    3. Token removed from URL (history protection)

    4. All subsequent requests use cookie automatically

    '
  scheme: cookie
  supportsGoals:
  - motivation.goal.security
  realizedBy:
  - application.service.authentication-service
  properties:
    auth.cookie-name: codetoreum_token
    auth.httponly: 'true'
    auth.max-age-seconds: '31536000'
    auth.samesite: Strict
    auth.secure-in-production: 'true'
  application: codetoreum
  authentication:
    provider: session
    sessionTimeout: 30
  roles:
  - description: Standard user role
    displayName: User Role
    name: user
  resources:
  - description: API resources
    operations:
    - description: Default access operation
      operation: access
    resource: api
    type: api
  dataClassification:
    classifications:
    - accessControl: role-based
      auditLevel: standard
      description: Internal data not for public release
      encryption: at-rest
      label: Internal Data
      level: internal
      retention:
        deleteAfter: false
        period: 1y
        reviewRequired: false
  displayName: HttpOnly Cookie Authentication
