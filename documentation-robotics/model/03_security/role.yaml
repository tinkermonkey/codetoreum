  path: security.role.admin
  spec_node_id: security.role
  type: role
  layer_id: security
  name: Admin
  description: Full system access role. Holds all permissions including user
    management, project CRUD, configuration updates, and workflow management.
    Maps to UserRole.ADMIN in the domain model.
