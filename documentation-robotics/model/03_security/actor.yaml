security.actor.developer:
  id: 6bedb456-b85f-4a3e-a7b0-16e2d97f532d
  path: security.actor.developer
  spec_node_id: security.actor
  type: actor
  layer_id: security
  name: Developer
  description: Human user accessing the REST API and configuration dashboard to
    manage workflows, view executions, and configure projects.
  attributes:
    type: human
    trustLevel: medium
    objectives:
      - Trigger and monitor workflows
      - Configure project settings
      - View agent execution results
