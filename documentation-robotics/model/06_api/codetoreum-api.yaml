  x-websocket-endpoints:
    /events/stream:
      description: 'WebSocket endpoint for real-time event streaming.


        **Authentication:** Provide token via query parameter: `?token=YOUR_TOKEN`


        **Subscription Types:**

        - all_events: Receive all events

        - workflow_events: Workflow-related events only

        - execution_events: Execution-related events only


        **Filtering:**

        - event_types: List of event types (OR logic)

        - work_item_id, workflow_id, agent_id: Filter by IDs (AND logic)


        **Backpressure:**

        - Buffer limit: 1000 events per client

        - Flow control warning at 80% capacity


        **Heartbeat:**

        - Server ping every 30 seconds

        - Client timeout after 90 seconds

        '
      x-archimate-ref: application.service.websocket-adapter
