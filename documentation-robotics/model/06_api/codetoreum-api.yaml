    /webhooks/github:
      post:
        operationId: github-webhook
        summary: Receive GitHub webhook events
        description: 'Receives and processes GitHub webhook POST requests.

          Translates webhook events into domain commands for workflow execution.


          Supported events: project_card, issues, issue_comment, pull_request, discussion

          '
        tags:
        - webhooks
        x-archimate-ref: application.service.webhook-adapter
        parameters:
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
          description: Unique delivery ID
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: Event type (project_card, issues, etc.)
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: HMAC signature for verification
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                description: GitHub webhook payload
        responses:
          '202':
            description: Webhook processed successfully
          '400':
            description: Invalid payload structure
          '401':
            description: Invalid HMAC signature
          '404':
            description: Repository not configured
          '500':
            description: Processing failed
