Codetoreum API:
  id: api.spec.codetoreum-api
  name: Codetoreum API
  type: openapi-spec
  documentation: Complete REST API specification for the Codetoreum AI Agent Orchestration
    Platform
  openapi: 3.0.3
  info:
    title: Codetoreum API
    version: 2.0.0
    description: 'AI Agent Orchestration Platform API with single-token authentication.


      Authentication uses a simplified JupyterLab-style single-token system.

      On server startup, a token is generated and printed to the console.

      Use the token in requests via:

      - Authorization header: `Bearer <token>`

      - Query parameter: `?token=<token>`

      - HttpOnly cookie (for web clients)

      '
  servers:
  - url: /api/v2
    description: Production API v2
  tags:
  - name: work-items
    description: Work item CRUD operations
    x-archimate-ref: application.service.work-item-service
  - name: workflows
    description: Workflow definition management
    x-archimate-ref: application.service.workflow-definition-service
  - name: orchestrator
    description: Workflow orchestration control
    x-archimate-ref: application.service.workflow-orchestrator
  - name: scheduler
    description: Execution queue management
    x-archimate-ref: application.service.agent-scheduler
  - name: agents
    description: Agent registry operations
    x-archimate-ref: application.service.agent-registry-service
  - name: executions
    description: Execution monitoring and control
    x-archimate-ref: application.service.execution-service
  - name: configuration
    description: Configuration management
    x-archimate-ref: application.service.configuration-service
  - name: metrics
    description: System metrics and health
    x-archimate-ref: application.service.metrics-service
  - name: workspace
    description: Workspace and container management
    x-archimate-ref: application.service.workspace-router
  - name: events
    description: Event store operations
    x-archimate-ref: application.service.event-service
  - name: webhooks
    description: GitHub webhook integration
    x-archimate-ref: application.service.webhook-adapter
  - name: health
    description: Health check endpoints
  - name: authentication
    description: Authentication operations
  paths:
    /work-items:
      get:
        operationId: list-work-items
        summary: List work items with filtering and pagination
        description: 'List work items with optional filtering and pagination.

          Supports filtering by project, status, assignee, labels, workflow stage,
          and priority.

          Full-text search in title and description via the `search` parameter.

          '
        tags:
        - work-items
        x-archimate-ref: application.service.work-item-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: project_id
          in: query
          schema:
            type: string
          description: Filter by project ID
        - name: status
          in: query
          schema:
            type: string
            enum:
            - NEW
            - ASSIGNED
            - IN_PROGRESS
            - UNDER_REVIEW
            - COMPLETED
            - FAILED
            - BLOCKED
          description: Filter by status
        - name: assignee
          in: query
          schema:
            type: string
          description: Filter by assigned agent ID
        - name: labels
          in: query
          schema:
            type: string
          description: Filter by labels (comma-separated, AND logic)
        - name: workflow_stage
          in: query
          schema:
            type: string
          description: Filter by current workflow stage
        - name: priority
          in: query
          schema:
            type: string
            enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          description: Filter by priority
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search in title and description
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Pagination offset
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Pagination limit (max 100)
        - name: sort_by
          in: query
          schema:
            type: string
            default: updated_at
            enum:
            - created_at
            - updated_at
            - priority
            - title
            - status
          description: Sort field
        - name: sort_order
          in: query
          schema:
            type: string
            default: desc
            enum:
            - asc
            - desc
          description: Sort order
        responses:
          '200':
            description: List of work items with pagination metadata
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkItemListResponse'
          '400':
            description: Invalid filter parameters
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '401':
            description: Authentication required
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
      post:
        operationId: create-work-item
        summary: Create a new work item
        tags:
        - work-items
        x-archimate-ref: application.service.work-item-service
        security:
        - bearerAuth: []
        - queryToken: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkItemRequest'
        responses:
          '201':
            description: Work item created successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkItemResponse'
          '400':
            description: Invalid request parameters
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '401':
            description: Authentication required
          '404':
            description: Project not found
    /work-items/{work_item_id}:
      get:
        operationId: get-work-item
        summary: Get work item details
        description: Get detailed information about a specific work item including
          history
        tags:
        - work-items
        x-archimate-ref: application.service.work-item-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: work_item_id
          in: path
          required: true
          schema:
            type: string
          description: Work item ID
        responses:
          '200':
            description: Work item details with history
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkItemDetailResponse'
          '401':
            description: Authentication required
          '404':
            description: Work item not found
      put:
        operationId: update-work-item
        summary: Update work item
        description: Update an existing work item. Only provided fields will be updated.
        tags:
        - work-items
        x-archimate-ref: application.service.work-item-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: work_item_id
          in: path
          required: true
          schema:
            type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkItemRequest'
        responses:
          '200':
            description: Work item updated successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkItemResponse'
          '400':
            description: Invalid request parameters
          '401':
            description: Authentication required
          '404':
            description: Work item not found
      delete:
        operationId: delete-work-item
        summary: Delete work item (soft delete)
        description: 'Soft delete a work item. The work item is marked as deleted
          but remains

          in the event store for audit trail purposes.

          '
        tags:
        - work-items
        x-archimate-ref: application.service.work-item-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: work_item_id
          in: path
          required: true
          schema:
            type: string
        responses:
          '200':
            description: Work item deleted successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CommandResult'
          '401':
            description: Authentication required
          '404':
            description: Work item not found
    /workflows:
      get:
        operationId: list-workflows
        summary: List workflow definitions with filtering and pagination
        tags:
        - workflows
        x-archimate-ref: application.service.workflow-definition-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: project_id
          in: query
          schema:
            type: string
          description: Filter by project ID
        - name: is_template
          in: query
          schema:
            type: boolean
          description: Filter by template status
        - name: is_active
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: work_item_type
          in: query
          schema:
            type: string
          description: Filter by applicable work item type
        - name: name_contains
          in: query
          schema:
            type: string
          description: Filter by partial name match
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort_by
          in: query
          schema:
            type: string
            default: updated_at
            enum:
            - name
            - created_at
            - updated_at
            - version
        - name: sort_order
          in: query
          schema:
            type: string
            default: desc
            enum:
            - asc
            - desc
        responses:
          '200':
            description: List of workflow definitions
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowListResponse'
          '400':
            description: Invalid filter parameters
          '401':
            description: Authentication required
      post:
        operationId: create-workflow
        summary: Create a new workflow definition
        description: 'Create a new workflow definition with stages and transitions.

          Validates for circular dependencies and agent references.

          '
        tags:
        - workflows
        x-archimate-ref: application.service.workflow-definition-service
        security:
        - bearerAuth: []
        - queryToken: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkflowRequest'
        responses:
          '201':
            description: Workflow created successfully with version 1
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowResponse'
          '400':
            description: Invalid parameters, circular dependencies, or invalid agent
              references
          '401':
            description: Authentication required
          '404':
            description: Project not found
    /workflows/{workflow_id}:
      get:
        operationId: get-workflow
        summary: Get workflow definition details
        tags:
        - workflows
        x-archimate-ref: application.service.workflow-definition-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: integer
          description: Specific version to retrieve (defaults to latest)
        responses:
          '200':
            description: Workflow definition with stages and transitions
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowResponse'
          '401':
            description: Authentication required
          '404':
            description: Workflow or version not found
      put:
        operationId: update-workflow
        summary: Update workflow definition
        description: 'Update an existing workflow definition. Creates a new version

          while preserving history.

          '
        tags:
        - workflows
        x-archimate-ref: application.service.workflow-definition-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkflowRequest'
        responses:
          '200':
            description: Workflow updated, new version created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowResponse'
          '400':
            description: Invalid parameters or circular dependencies
          '401':
            description: Authentication required
          '404':
            description: Workflow not found
      delete:
        operationId: delete-workflow
        summary: Delete workflow definition (soft delete)
        tags:
        - workflows
        x-archimate-ref: application.service.workflow-definition-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          schema:
            type: boolean
            default: false
          description: Force deletion even if active executions exist
        responses:
          '200':
            description: Workflow deleted successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CommandResult'
          '401':
            description: Authentication required
          '404':
            description: Workflow not found
          '409':
            description: Active executions exist and force=false
    /workflows/{workflow_id}/versions:
      get:
        operationId: get-workflow-versions
        summary: Get workflow version history
        tags:
        - workflows
        x-archimate-ref: application.service.workflow-definition-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
          description: Maximum number of versions to return
        responses:
          '200':
            description: List of versions with metadata
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowVersionListResponse'
          '401':
            description: Authentication required
          '404':
            description: Workflow not found
    /workflows/{workflow_id}/validate:
      get:
        operationId: validate-workflow
        summary: Validate workflow definition
        description: 'Validates a workflow for circular dependencies, invalid agent
          references,

          entry condition validity, and transition consistency.

          '
        tags:
        - workflows
        x-archimate-ref: application.service.workflow-definition-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: integer
          description: Specific version to validate (defaults to latest)
        responses:
          '200':
            description: Validation result with errors and warnings
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowValidationResponse'
          '401':
            description: Authentication required
          '404':
            description: Workflow or version not found
    /orchestrator/start:
      post:
        operationId: start-workflow-execution
        summary: Start workflow execution for a work item
        description: 'Starts a workflow execution for a work item. Validates workflow
          and work item,

          checks entry conditions, creates a workflow run, and queues the first agent
          execution.

          '
        tags:
        - orchestrator
        x-archimate-ref: application.service.workflow-orchestrator
        security:
        - bearerAuth: []
        - queryToken: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartWorkflowExecutionRequest'
        responses:
          '202':
            description: Workflow execution queued successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StartWorkflowExecutionResponse'
          '400':
            description: Invalid parameters or entry conditions not met
          '401':
            description: Authentication required
          '404':
            description: Workflow or work item not found
    /orchestrator/{workflow_run_id}/cancel:
      post:
        operationId: cancel-workflow-execution
        summary: Cancel workflow execution
        tags:
        - orchestrator
        x-archimate-ref: application.service.workflow-orchestrator
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_run_id
          in: path
          required: true
          schema:
            type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelWorkflowExecutionRequest'
        responses:
          '200':
            description: Cancellation initiated successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowExecutionResponse'
          '401':
            description: Authentication required
          '404':
            description: Workflow run not found
    /orchestrator/{workflow_run_id}/pause:
      post:
        operationId: pause-workflow-execution
        summary: Pause workflow execution
        description: 'Pause an active workflow. Current agent execution completes,

          but no new executions start until resumed.

          '
        tags:
        - orchestrator
        x-archimate-ref: application.service.workflow-orchestrator
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_run_id
          in: path
          required: true
          schema:
            type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseWorkflowExecutionRequest'
        responses:
          '200':
            description: Workflow paused successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowExecutionResponse'
          '400':
            description: Workflow not in pausable state
          '401':
            description: Authentication required
          '404':
            description: Workflow run not found
    /orchestrator/{workflow_run_id}/resume:
      post:
        operationId: resume-workflow-execution
        summary: Resume paused workflow execution
        tags:
        - orchestrator
        x-archimate-ref: application.service.workflow-orchestrator
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: workflow_run_id
          in: path
          required: true
          schema:
            type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeWorkflowExecutionRequest'
        responses:
          '200':
            description: Workflow resumed successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/WorkflowExecutionResponse'
          '400':
            description: Workflow not in paused state
          '401':
            description: Authentication required
          '404':
            description: Workflow run not found
    /orchestrator/validate-entry-conditions:
      post:
        operationId: validate-entry-conditions
        summary: Validate workflow entry conditions
        description: 'Check whether entry conditions are met for starting a workflow.

          Call before starting a workflow to validate conditions.

          '
        tags:
        - orchestrator
        x-archimate-ref: application.service.workflow-orchestrator
        security:
        - bearerAuth: []
        - queryToken: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryConditionValidationRequest'
        responses:
          '200':
            description: Validation result
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/EntryConditionValidationResponse'
          '401':
            description: Authentication required
          '404':
            description: Workflow or work item not found
    /scheduler/queue:
      get:
        operationId: get-execution-queue
        summary: Get execution queue and scheduling status
        description: 'Returns list of queued and running agent executions with work
          item details

          and queue statistics.

          '
        tags:
        - scheduler
        x-archimate-ref: application.service.agent-scheduler
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
            - queued
            - running
            - pending
            - completed
            - failed
            - cancelled
            - paused
          description: Filter by execution status
        - name: workflow_run_id
          in: query
          schema:
            type: string
          description: Filter by workflow run ID
        - name: work_item_id
          in: query
          schema:
            type: string
          description: Filter by work item ID
        - name: project_name
          in: query
          schema:
            type: string
          description: Filter by project name
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Items per page (max 100)
        responses:
          '200':
            description: List of executions with queue statistics
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ExecutionQueueResponse'
          '400':
            description: Invalid filter parameters
          '401':
            description: Authentication required
    /scheduler/queue/stats:
      get:
        operationId: get-queue-statistics
        summary: Get detailed queue statistics
        description: 'Returns aggregate metrics about queue depth, processing times,

          and priority distribution.

          '
        tags:
        - scheduler
        x-archimate-ref: application.service.agent-scheduler
        security:
        - bearerAuth: []
        - queryToken: []
        responses:
          '200':
            description: Queue statistics
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/QueueStatisticsResponse'
          '401':
            description: Authentication required
    /agents:
      get:
        operationId: list-agents
        summary: List agents with filtering and pagination
        tags:
        - agents
        x-archimate-ref: application.service.agent-registry-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: capability
          in: query
          schema:
            type: string
          description: Filter by capability/skill
        - name: agent_type
          in: query
          schema:
            type: string
            enum:
            - maker
            - reviewer
            - specialized
            - code_generator
            - code_reviewer
            - tester
            - documenter
          description: Filter by agent type
        - name: requires_docker
          in: query
          schema:
            type: boolean
          description: Filter by Docker requirement
        - name: makes_code_changes
          in: query
          schema:
            type: boolean
          description: Filter by code modification capability
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sort_by
          in: query
          schema:
            type: string
            default: updated_at
            enum:
            - name
            - display_name
            - agent_type
            - created_at
            - updated_at
        - name: sort_order
          in: query
          schema:
            type: string
            default: desc
            enum:
            - asc
            - desc
        responses:
          '200':
            description: List of agents with pagination metadata
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AgentListResponse'
          '400':
            description: Invalid filter parameters
          '401':
            description: Authentication required
      post:
        operationId: create-agent
        summary: Create a new agent
        description: 'Create a new agent definition with capabilities and configuration.

          Agent name must be unique. At least one capability is required.

          '
        tags:
        - agents
        x-archimate-ref: application.service.agent-registry-service
        security:
        - bearerAuth: []
        - queryToken: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentRequest'
        responses:
          '201':
            description: Agent created successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AgentResponse'
          '400':
            description: Invalid parameters or agent name already exists
          '401':
            description: Authentication required
    /agents/{agent_id}:
      get:
        operationId: get-agent
        summary: Get agent details
        description: Get detailed agent information including capabilities and execution
          statistics
        tags:
        - agents
        x-archimate-ref: application.service.agent-registry-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - name: include_stats
          in: query
          schema:
            type: boolean
            default: true
          description: Include execution statistics
        responses:
          '200':
            description: Agent details with capabilities and optional stats
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AgentResponse'
          '401':
            description: Authentication required
          '404':
            description: Agent not found
      put:
        operationId: update-agent
        summary: Update agent configuration
        description: Update an existing agent's configuration. Only provided fields
          are updated.
        tags:
        - agents
        x-archimate-ref: application.service.agent-registry-service
        security:
        - bearerAuth: []
        - queryToken: []
        parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAgentRequest'
        responses:
          '200':
            description: Agent updated successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AgentResponse'
          '400':
            description: Invalid request parameters
          '401':
            description: Authentication required
          '404':
            description: Agent not found
      delete:
        operationId: delete-agent
        summary: Delete agent (soft delete)
        description: Soft delete an agent. Agent is marked deleted but preserved in
          event store.
