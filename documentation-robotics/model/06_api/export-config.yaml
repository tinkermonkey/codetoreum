openapi: 3.0.0
info:
  title: Codetoreum API
  version: 2.0.0
  description: AI Agent Orchestration Platform API
paths:
  /api/v2/config/export:
    get:
      operationId: export-config
      summary: Export Configuration
      description: Export configuration as JSON/YAML
      tags:
      - configuration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from httpOnly cookie authentication
