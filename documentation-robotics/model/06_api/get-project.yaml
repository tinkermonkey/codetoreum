openapi: 3.0.0
info:
  title: Codetoreum API
  version: 2.0.0
  description: AI Agent Orchestration Platform API
paths:
  /api/v2/config/projects/{project_id}:
    get:
      operationId: get-project
      summary: Get Project
      description: Get project details
      tags:
      - configuration
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from httpOnly cookie authentication
