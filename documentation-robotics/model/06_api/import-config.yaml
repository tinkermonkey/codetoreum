openapi: 3.0.0
info:
  title: Codetoreum API
  version: 2.0.0
  description: AI Agent Orchestration Platform API
paths:
  /api/v2/config/import:
    post:
      operationId: import-config
      summary: Import Configuration
      description: Import configuration from JSON/YAML
      tags:
      - configuration
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Import created successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from httpOnly cookie authentication
