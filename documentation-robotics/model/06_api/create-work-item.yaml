openapi: 3.0.0
info:
  title: Codetoreum API
  version: 2.0.0
  description: AI Agent Orchestration Platform API
paths:
  /api/v2/work-items:
    post:
      operationId: create-work-item
      summary: Create Work Item
      description: Create a new work item
      tags:
      - work-items
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Create created successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from httpOnly cookie authentication
