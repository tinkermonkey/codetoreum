Authentication Flow:
  id: navigation.flow.authentication
  name: Authentication Flow
  type: user-flow
  documentation: 'Complete user authentication journey.


    Entry points:

    1. Direct URL access with token query parameter

    2. Previously authenticated (cookie exists)

    3. New user (no authentication)


    Flow for new users with token:

    1. User receives access URL from server console

    2. User navigates to URL with ?token=...

    3. App detects token in URL

    4. Token exchanged for httpOnly cookie via /v2/health

    5. URL cleaned (token removed from browser history)

    6. Auth state updated to authenticated

    7. Dashboard displayed


    Flow for returning users:

    1. User navigates to app

    2. Cookie validated via /v2/auth/token-info

    3. If valid: Dashboard displayed

    4. If invalid: Cookie cleared, AuthRequired shown


    Flow for new users without token:

    1. User navigates to app

    2. No cookie present

    3. AuthRequiredPage displayed with instructions

    '
  supportsGoals:
  - motivation.goal.security
  - motivation.goal.ease-of-configuration
  steps:
  - description: Check authentication state
    id: entry
    name: Entry Point
    transitions:
    - condition: isLoading
      target: loading
    - condition: isAuthenticated
      target: dashboard
    - condition: hasUrlToken
      target: exchange-token
    - condition: default
      target: auth-required
    type: decision
  - description: Show loading spinner while checking auth
    id: loading
    name: Loading State
    screen: ux.screen.dashboard
    type: display
  - description: Exchange URL token for httpOnly cookie
    id: exchange-token
    name: Exchange Token
    transitions:
    - condition: success
      target: clean-url
    - condition: failure
      target: auth-required
    type: action
  - description: Remove token from URL via history.replaceState
    id: clean-url
    name: Clean URL
    transitions:
    - condition: always
      target: dashboard
    type: action
  - description: Show main dashboard
    id: dashboard
    name: Dashboard
    screen: ux.screen.dashboard
    type: display
  - description: Show authentication instructions
    id: auth-required
    name: Auth Required
    screen: ux.screen.auth-required
    type: display
  properties:
    flow.auth-required: 'false'
    flow.entry-points: url-token,cookie,none
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /login
    identifier: auth-flow
    name: Authentication Flow
    type: experience
Project Onboarding Flow:
  id: navigation.flow.onboarding
  name: Project Onboarding Flow
  type: user-flow
  documentation: 'New project configuration journey.


    Steps:

    1. Navigate to Project Configuration

    2. Add environment variables (API keys, secrets)

    3. Mount custom commands

    4. Configure sub-agents

    5. Navigate to Workflow Configuration

    6. Define pipeline stages

    7. Assign agents to stages

    8. Configure entry conditions and transitions

    9. Navigate to Agent Configuration

    10. Customize agent settings

    11. Set capabilities and constraints


    Note: Steps 5-11 pending UI implementation.

    '
  supportsGoals:
  - motivation.goal.ease-of-configuration
  steps:
  - description: Set project environment and commands
    id: project-config
    name: Configure Project
    screen: ux.screen.project-config
    transitions:
    - condition: complete
      target: workflow-config
    type: display
  - description: Define pipeline stages and transitions
    id: workflow-config
    name: Configure Workflows
    screen: ux.screen.workflow-config
    transitions:
    - condition: complete
      target: agent-config
    type: display
  - description: Customize agent settings
    id: agent-config
    name: Configure Agents
    screen: ux.screen.agent-config
    transitions:
    - condition: complete
      target: ready
    type: display
  - description: Project fully configured
    id: ready
    name: Ready
    type: end
  properties:
    flow.linear: 'false'
    flow.steps-optional: workflow-config,agent-config
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /onboarding
    identifier: onboarding-flow
    name: Onboarding Flow
    type: experience
