Work Item State Machine:
  id: navigation.state-machine.work-item
  name: Work Item State Machine
  type: state-machine
  documentation: 'Work item lifecycle states and transitions.


    States:

    - open: Newly created, not yet started

    - in_progress: Currently being processed

    - completed: Successfully finished

    - failed: Processing failed

    - cancelled: Manually cancelled


    Transitions:

    - open -> in_progress: When execution starts

    - in_progress -> completed: When execution succeeds

    - in_progress -> failed: When execution fails

    - any -> cancelled: Manual cancellation

    '
  states:
  - description: Work item created, awaiting processing
    id: open
    name: Open
    type: initial
  - description: Currently being processed by agent
    id: in_progress
    name: In Progress
    type: active
  - description: Successfully processed
    id: completed
    name: Completed
    type: final
  - description: Processing failed
    id: failed
    name: Failed
    type: final
  - description: Manually cancelled
    id: cancelled
    name: Cancelled
    type: final
  transitions:
  - from: active
    to: cancelled
    trigger: cancel
    description: User cancels work item
  properties:
    state-machine.type: WorkItemStatus
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /work-items
    identifier: work-item-state
    name: Work Item State
    type: experience
Execution State Machine:
  id: navigation.state-machine.execution
  name: Execution State Machine
  type: state-machine
  documentation: 'Agent execution lifecycle states and transitions.


    States:

    - queued: Waiting in scheduler queue

    - running: Currently executing in container

    - completed: Successfully finished

    - failed: Execution failed

    - cancelled: Manually terminated

    - timeout: Exceeded time limit


    Transitions defined by ExecutionService events.

    '
  states:
  - description: Waiting for scheduler
    id: queued
    name: Queued
    type: initial
  - description: Executing in container
    id: running
    name: Running
    type: active
  - description: Successfully finished
    id: completed
    name: Completed
    type: final
  - description: Execution error
    id: failed
    name: Failed
    type: final
  - description: Manually terminated
    id: cancelled
    name: Cancelled
    type: final
  - description: Exceeded time limit
    id: timeout
    name: Timeout
    type: final
  transitions:
  - from: running
    to: terminated
    trigger: cancel
    description: User terminates execution
  properties:
    state-machine.type: ExecutionStatus
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /executions
    identifier: execution-state
    name: Execution State
    type: experience
WebSocket Connection State Machine:
  id: navigation.state-machine.websocket
  name: WebSocket Connection State Machine
  type: state-machine
  documentation: 'WebSocket connection lifecycle states.


    States:

    - disconnected: No active connection

    - connecting: Attempting to establish connection

    - connected: Active WebSocket connection

    - reconnecting: Automatic reconnection in progress


    Reconnection behavior:

    - Exponential backoff (1s, 2s, 4s, 8s, 16s, 30s max)

    - Maximum 10 attempts

    - No reconnection on code 4001 (Unauthorized)

    '
  states:
  - description: No active connection
    id: disconnected
    name: Disconnected
    type: initial
  - description: Establishing connection
    id: connecting
    name: Connecting
    type: transitional
  - description: Active connection
    id: connected
    name: Connected
    type: active
  - description: Automatic reconnection
    id: reconnecting
    name: Reconnecting
    type: transitional
  transitions:
  - from: connecting
    to: disconnected
    trigger: failure
    description: Connection failed
  properties:
    state-machine.backoff: exponential
    state-machine.max-attempts: '10'
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /ws
    identifier: websocket-state
    name: WebSocket State
    type: experience
Authentication State Machine:
  id: navigation.state-machine.authentication
  name: Authentication State Machine
  type: state-machine
  documentation: 'Frontend authentication states.


    States:

    - loading: Initial state, checking authentication

    - unauthenticated: No valid authentication

    - authenticating: Exchanging token for cookie

    - authenticated: Valid session active


    State stored in Zustand (not persisted, validated on load).

    '
  states:
  - description: Checking authentication status
    id: loading
    name: Loading
    type: initial
  - description: No valid session
    id: unauthenticated
    name: Unauthenticated
    type: inactive
  - description: Exchanging token
    id: authenticating
    name: Authenticating
    type: transitional
  - description: Valid session
    id: authenticated
    name: Authenticated
    type: active
  transitions:
  - from: authenticating
    to: unauthenticated
    trigger: failure
    description: Authentication failed
  properties:
    state-machine.store: zustand
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /auth
    identifier: auth-state
    name: Auth State
    type: experience
Authentication Guard:
  id: navigation.guard.auth
  name: Authentication Guard
  type: guard
  documentation: 'Route protection based on authentication state.


    Implementation:

    - Checks isAuthenticated from useAuth hook

    - During loading: Shows spinner

    - If not authenticated: Shows AuthRequiredPage

    - If authenticated: Renders protected route


    Applied to all routes via App.tsx conditional rendering.

    '
  appliesTo:
  - navigation.route.root
  - navigation.route.config
  - navigation.route.workflows
  - navigation.route.agents
  - navigation.route.history
  usesAuthScheme:
  - security.authentication.httponly-cookie-auth
  properties:
    guard.fallback: ux.screen.auth-required
    guard.type: authentication
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /protected
    identifier: auth-guard
    name: Auth Guard
    type: experience
