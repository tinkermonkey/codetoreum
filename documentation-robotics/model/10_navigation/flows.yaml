  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /error
    identifier: error-guard
    name: Error Guard
    type: experience
Deep Link Patterns:
  id: navigation.deep-linking.patterns
  name: Deep Link Patterns
  type: deep-linking
  documentation: 'URL patterns for direct navigation to specific views.


    Current patterns:

    - / - Dashboard

    - /config - Project configuration

    - /workflows - Workflow configuration

    - /agents - Agent configuration

    - /history - Configuration history

    - /?token=... - Authentication with token


    Planned patterns:

    - /work-items/:id - Work item detail

    - /executions/:id - Execution detail

    - /executions/:id/logs - Execution logs

    - /history/:changeId - Specific config change

    '
  patterns:
  - pattern: /
    route: navigation.route.root
  - pattern: /config
    route: navigation.route.config
  - pattern: /workflows
    route: navigation.route.workflows
  - pattern: /agents
    route: navigation.route.agents
  - pattern: /history
    route: navigation.route.history
  properties:
    deep-linking.router: react-router-dom
    deep-linking.strategy: browser
  version: 1.0.0
  application: codetoreum
  routes:
  - addressing:
      url: /deep
    identifier: deep-link
    name: Deep Link
    type: experience
