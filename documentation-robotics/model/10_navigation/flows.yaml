  type: user-flow
  documentation: 'Configuration modification and review journey.


    Steps:

    1. Navigate to appropriate config screen

    2. Make changes (add/edit/delete)

    3. Changes saved immediately (mutations)

    4. (Planned) View change in history

    5. (Planned) Compare with previous version

    6. (Planned) Rollback if needed


    Current implementation:

    - Steps 1-3 functional for project config

    - Steps 4-6 pending history UI

    '
  supportsGoals:
  - motivation.goal.ease-of-configuration
  - motivation.goal.observability
  steps:
