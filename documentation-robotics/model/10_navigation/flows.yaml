  name: Root Route
  type: route
  documentation: 'Application root route.


    Behavior:

    - If authenticated: Shows DashboardPage

    - If not authenticated: Shows AuthRequiredPage

    - If loading auth: Shows loading spinner


    Path: /

    '
  path: /
  component: ux.screen.dashboard
  fallback: ux.screen.auth-required
  properties:
    route.loading-state: spinner
    route.requires-auth: 'true'
  version: 1.0.0
  application: application.component.frontend-application
  routes:
  - addressing:
      url: /
    identifier: root
    name: Root
    type: experience
