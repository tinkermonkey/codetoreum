# Navigation Guards for Codetoreum Platform
# Authentication and authorization checks with proper guard structure

Authentication Required Guard:
  id: navigation.guard.auth-required
  name: Authentication Required Guard
  type: guard
  version: "1.0.0"
  application: codetoreum
  documentation: |
    Primary authentication guard for all protected routes.
    Checks for valid session token in:
    1. Query parameter 'token' (for initial auth)
    2. HttpOnly cookie 'session_token' (for subsequent requests)

    On failure, redirects to /auth-required page.
  routes:
    - identifier: auth-required-guard
      name: Authentication Required
      type: experience
      addressing:
        url: /auth-guard
  guards:
    - name: auth-required
      type: authentication
      description: Verifies user has valid authentication token
      order: 1
      condition:
        expression: hasValidAuthToken()
        async: true
        timeout: 3000
      onDeny:
        action: redirect
        target: navigation.route.auth-required
        message: Authentication required. Please sign in.
        preserveRoute: true

Admin Only Guard:
  id: navigation.guard.admin-only
  name: Admin Only Guard
  type: guard
  version: "1.0.0"
  application: codetoreum
  documentation: |
    Authorization guard for admin-only routes like system health monitoring.
    Requires authenticated user with 'admin' role.

    On failure, redirects to dashboard with access denied message.
  routes:
    - identifier: admin-only-guard
      name: Admin Only
      type: experience
      addressing:
        url: /admin-guard
  guards:
    - name: admin-only
      type: authorization
      description: Verifies user has administrator role
      order: 2
      condition:
        expression: hasRole('admin')
        async: false
        timeout: 1000
      onDeny:
        action: redirect
        target: navigation.route.root
        message: Access denied. Administrator privileges required.
        preserveRoute: false

WebSocket Auth Guard:
  id: navigation.guard.websocket-auth
  name: WebSocket Connection Guard
  type: guard
  version: "1.0.0"
  application: codetoreum
  documentation: |
    Validates WebSocket connections for real-time event streaming.
    Token passed in WebSocket handshake headers.
  routes:
    - identifier: websocket-auth-guard
      name: WebSocket Auth
      type: experience
      addressing:
        url: /ws-auth-guard
  guards:
    - name: websocket-auth
      type: authentication
      description: Validates WebSocket connection authentication
      order: 1
      condition:
        expression: hasValidWebSocketToken()
        async: true
        timeout: 2000
      onDeny:
        action: abort
        message: WebSocket authentication failed
        preserveRoute: false

Rate Limit Guard:
  id: navigation.guard.rate-limit
  name: Rate Limit Guard
  type: guard
  version: "1.0.0"
  application: codetoreum
  documentation: |
    Applied to API routes to prevent abuse.
    Returns 429 Too Many Requests when limit exceeded.
  routes:
    - identifier: rate-limit-guard
      name: Rate Limit
      type: experience
      addressing:
        url: /rate-limit-guard
  guards:
    - name: rate-limit
      type: validation
      description: Enforces API rate limiting per client
      order: 1
      condition:
        expression: withinRateLimit()
        async: true
        timeout: 500
      onDeny:
        action: show-error
        message: Rate limit exceeded. Please try again later.
        preserveRoute: true

CORS Guard:
  id: navigation.guard.cors
  name: CORS Policy Guard
  type: guard
  version: "1.0.0"
  application: codetoreum
  documentation: |
    Validates origin header against allowed origins list.
    Returns 403 Forbidden for disallowed origins.
  routes:
    - identifier: cors-guard
      name: CORS Policy
      type: experience
      addressing:
        url: /cors-guard
  guards:
    - name: cors
      type: validation
      description: Enforces Cross-Origin Resource Sharing policy
      order: 1
      condition:
        expression: isAllowedOrigin()
        async: false
        timeout: 500
      onDeny:
        action: show-error
        message: Origin not allowed by CORS policy
        preserveRoute: false
