# Navigation Routes for Codetoreum Platform
# Each element defines a route with proper nested structure

Root Route:
  id: navigation.route.root
  name: Dashboard Route
  type: route
  version: "1.0.0"
  application: codetoreum
  documentation: 'Primary landing page after authentication. Shows Dashboard for authenticated users.'
  path: /
  component: ux.screen.dashboard
  fallback: ux.screen.auth-required
  properties:
    route.requires-auth: 'true'
    route.loading-state: spinner
  routes:
    - identifier: root
      name: Root
      type: experience
      addressing:
        url: /
      guards:
        - auth-required

Auth Required Route:
  id: navigation.route.auth-required
  name: Authentication Required Route
  type: route
  version: "1.0.0"
  application: codetoreum
  documentation: 'Public page guiding users to authenticate via query parameter.'
  path: /auth-required
  component: ux.screen.auth-required
  routes:
    - identifier: auth-required
      name: Authentication Required
      type: experience
      addressing:
        url: /auth-required

