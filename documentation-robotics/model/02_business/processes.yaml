Automated Development Workflow:
  id: business.process.automated-development-workflow
  name: Automated Development Workflow
  type: process
  documentation: End-to-end business process for automating software development tasks
    from work item creation through implementation, review, and completion, orchestrating
    AI agents and human reviewers
Work Item Lifecycle:
  id: business.process.work-item-lifecycle
  name: Work Item Lifecycle
  type: process
  documentation: Business process managing the complete lifecycle of a work item from
    creation, through assignment, execution, review cycles, and final completion or
    rejection
Agent Execution Cycle:
  id: business.process.agent-execution-cycle
  name: Agent Execution Cycle
  type: process
  documentation: Business process for executing AI agent tasks including context preparation,
    environment setup, task execution, output collection, and result processing
Maker-Checker Review:
  id: business.process.maker-checker-review
  name: Maker-Checker Review
  type: process
  documentation: Quality assurance process implementing maker-checker patterns where
    outputs from one agent are reviewed by another agent or human reviewer before
    acceptance
Feedback Integration:
  id: business.process.feedback-integration
  name: Feedback Integration
  type: process
  documentation: Business process for collecting review feedback, analyzing required
    changes, and routing work items back through appropriate execution stages
Project Onboarding:
  id: business.process.project-onboarding
  name: Project Onboarding
  type: process
  documentation: Business process for setting up new projects in Codetoreum including
    repository configuration, agent assignment, pipeline definition, and access control
    setup
Pipeline Configuration:
  id: business.process.pipeline-configuration
  name: Pipeline Configuration
  type: process
  documentation: Business process for defining and configuring development pipelines
    with stages, transitions, agents, and review requirements
Platform Monitoring:
  id: business.process.platform-monitoring
  name: Platform Monitoring
  type: process
  documentation: Business process for continuous monitoring of platform health, agent
    execution status, resource utilization, and alerting on anomalies
Incident Response:
  id: business.process.incident-response
  name: Incident Response
  type: process
  documentation: Business process for responding to platform incidents including execution
    failures, timeout handling, escalation, and recovery procedures
