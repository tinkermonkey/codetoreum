Python 3.11+ Runtime:
  id: technology.systemsoftware.python-runtime
  name: Python 3.11+ Runtime
  type: systemsoftware
  documentation: Primary programming language runtime for the Codetoreum platform
    with async IO support, type hints, and dataclasses
  softwareType: middleware
  properties:
    software.version: 3.11+
    software.license: opensource
FastAPI:
