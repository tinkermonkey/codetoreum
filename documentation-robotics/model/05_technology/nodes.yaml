Event Bus Infrastructure:
  id: technology.node.event-bus
  name: Event Bus Infrastructure
  type: node
  documentation: Redis-based event bus for domain event publishing and subscription
    providing pub-sub messaging, event streaming, and dead-letter queue functionality
  nodeType: container
  properties:
    node.provider: Docker
Configuration Store Infrastructure:
  id: technology.node.config-store
  name: Configuration Store Infrastructure
  type: node
  documentation: PostgreSQL-based configuration storage with versioning providing
    versioned config, search capability, and audit trail
  nodeType: database-cluster
  properties:
    node.provider: Docker
Event Store Infrastructure:
  id: technology.node.event-store
  name: Event Store Infrastructure
  type: node
  documentation: Elasticsearch-based event sourcing storage providing event sourcing,
    event replay, and query capability
  nodeType: database-cluster
  properties:
    node.provider: Docker
Agent Container Infrastructure:
  id: technology.node.agent-containers
  name: Agent Container Infrastructure
  type: node
  documentation: Docker-based isolated execution environments for AI agents providing
    isolated execution, resource limits, filesystem isolation, and network isolation
  nodeType: container
  properties:
    node.provider: Docker
Application Server:
  description: Host for core application services
  id: technology.node.application-server
  name: Application Server
  type: node
  nodeType: server
