Work Item:
  id: data_model.schema.work-item
  name: Work Item
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Work Item
  description: 'Unit of work representing an issue, task, or feature to be processed
    by agents.

    Aggregate root with full lifecycle management.

    '
  required:
  - id
  - project_id
  - title
  - status
  - priority
  - created_at
  properties:
    assigned_agent_id:
      description: ID of currently assigned agent
      type: string
    blocking_issue_id:
      description: ID of blocking issue if status is BLOCKED
      type: string
    blocking_reason:
      description: Reason for being blocked
      type: string
    completed_at:
      description: When work completed
      format: date-time
      type: string
    created_at:
      description: When work item was created
      format: date-time
      type: string
    current_stage:
      description: Current workflow stage name
      type: string
    description:
      description: Detailed work item description
      type: string
    error_details:
      description: Details of failure if status is FAILED
      type: object
    external_id:
      description: External system identifier (e.g., GitHub issue number)
      type: string
    external_url:
      description: URL to external system (e.g., GitHub issue URL)
      format: uri
      type: string
    id:
      description: Unique work item identifier
      format: uuid
      type: string
    labels:
      description: Classification labels for workflow selection
      items:
        type: string
      type: array
    metadata:
      additionalProperties: true
      description: Additional metadata
      type: object
    priority:
      default: 3
      description: Priority level (1=lowest, 5=highest)
      maximum: 5
      minimum: 1
      type: integer
    project_id:
      description: Project this work item belongs to
      type: string
    started_at:
      description: When work began
      format: date-time
      type: string
    status:
      description: Current work item status
      enum:
      - NEW
      - ASSIGNED
      - IN_PROGRESS
      - UNDER_REVIEW
      - COMPLETED
      - FAILED
      - BLOCKED
      type: string
    title:
      description: Work item title
      maxLength: 500
      type: string
    updated_at:
      description: When work item was last updated
      format: date-time
      type: string
    workflow_id:
      description: ID of attached workflow
      type: string
  stored-in:
  - datastore.database.event-store
  x-aggregate-root: true
  x-business-object-ref: business.object.work-item
Agent:
  id: data_model.schema.agent
  name: Agent
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Agent
  description: 'Specialized AI agent with specific capabilities and role.

    Aggregate root with capability management.

    '
  required:
  - id
  - name
  - agent_type
  - model
  properties:
    id:
      type: string
      format: uuid
      description: Unique agent identifier
    name:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
      description: Agent name (kebab-case)
    display_name:
      type: string
      description: Human-readable agent name
    agent_type:
      type: string
      enum:
      - MAKER
      - REVIEWER
      - SPECIALIZED
      - ORCHESTRATOR
      - PLANNER
      description: Agent role type
    model:
      type: string
      description: LLM model identifier (e.g., claude-sonnet-4-20250514)
    timeout_seconds:
      type: integer
      minimum: 60
      maximum: 3600
      default: 600
      description: Execution timeout in seconds
    max_retries:
      type: integer
      minimum: 0
      maximum: 5
      default: 2
      description: Maximum retry attempts on failure
    capabilities:
      type: object
      additionalProperties:
        type: number
        minimum: 0
        maximum: 1
      description: Skill proficiency map (skill -> proficiency 0-1)
    constraints:
      type: object
      properties:
        makes_code_changes:
          type: boolean
          default: true
          description: Whether agent can modify code
        can_make_commits:
          type: boolean
          default: false
          description: Whether agent can create git commits
        filesystem_write_allowed:
          type: boolean
          default: true
          description: Whether agent can write to filesystem
        requires_docker:
          type: boolean
          default: false
          description: Whether agent requires Docker access
      description: Agent behavioral constraints
    mcp_servers:
      type: array
      items:
        type: string
      description: MCP server names to enable for this agent
    system_prompt:
      type: string
      description: Base system prompt for the agent
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    metadata:
      type: object
      additionalProperties: true
  stored-in:
  - datastore.database.event-store
  x-aggregate-root: true
Workflow:
  id: data_model.schema.workflow
  name: Workflow
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Workflow
  description: 'Multi-stage pipeline instance for work item processing.

    Aggregate root that orchestrates stage execution.

    '
  required:
  - id
  - work_item_id
  - template_id
  - project_id
  - status
  - stages
  properties:
    id:
      type: string
      format: uuid
      description: Unique workflow identifier
    work_item_id:
      type: string
      description: Work item being processed
    template_id:
      type: string
      description: Workflow template this was created from
    project_id:
      type: string
      description: Project context
    status:
      type: string
      enum:
      - PENDING
      - RUNNING
      - PAUSED
      - COMPLETED
      - FAILED
      - CANCELLED
      description: Current workflow status
    stages:
      type: array
      items:
        $ref: '#/definitions/pipeline-stage-inline'
      minItems: 1
      description: Ordered list of pipeline stages
    current_stage_index:
      type: integer
      minimum: 0
      description: Index of current stage
    completed_stages:
      type: array
      items:
        type: string
      description: Names of completed stages
    started_at:
      type: string
      format: date-time
    completed_at:
      type: string
      format: date-time
    paused_at:
      type: string
      format: date-time
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    metadata:
      type: object
      additionalProperties: true
  definitions:
    pipeline-stage-inline:
      type: object
      required:
      - id
      - name
      - stage_type
      - status
      properties:
        id:
          type: string
        name:
          type: string
        stage_type:
          type: string
          enum:
          - SEQUENTIAL
          - PARALLEL
          - REVIEW
        status:
          type: string
          enum:
          - PENDING
          - READY
          - RUNNING
          - COMPLETED
          - FAILED
          - SKIPPED
  stored-in:
  - datastore.database.event-store
  x-aggregate-root: true
Project Context:
  id: data_model.schema.project-context
  name: Project Context
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  title: Project Context
  description: 'Project-level configuration including repository settings, tech stack,

    and workflow mappings. Aggregate root for project configuration.

    '
  required:
  - id
  - name
  - repository_url
  - default_branch
  properties:
    id:
      type: string
      format: uuid
      description: Unique project identifier
    name:
      type: string
      pattern: ^[a-z][a-z0-9-]*$
      description: Project name (kebab-case)
    display_name:
      type: string
      description: Human-readable project name
    repository_url:
      type: string
      format: uri
      description: Git repository URL
    default_branch:
      type: string
      default: main
      description: Default branch name
    branch_prefix:
      type: string
      default: codetoreum/
      description: Prefix for agent-created branches
    tech_stack:
      type: object
      properties:
        primary_language:
          type: string
          enum:
          - python
          - javascript
          - typescript
          - go
          - java
          - rust
          - csharp
        frameworks:
          type: array
          items:
            type: string
        build_tools:
          type: array
          items:
            type: string
      description: Technology stack details
    primary_language:
      type: string
      description: Primary programming language
    test_command:
      type: string
      description: Command to run tests
    test_framework:
      type: string
      description: Test framework in use
    has_ci_cd:
      type: boolean
      default: false
      description: Whether project has CI/CD configured
    default_workflow_template_id:
      type: string
      description: Default workflow template for issues
    custom_workflows:
      type: array
      items:
        type: object
        properties:
          label_pattern:
            type: string
          workflow_template_id:
            type: string
          priority:
            type: integer
      description: Label-based workflow mappings
    has_dockerfile:
      type: boolean
      default: false
    dockerfile_path:
      type: string
      default: Dockerfile
    requires_dev_container:
      type: boolean
      default: false
    environment_variables:
      type: object
      additionalProperties:
        type: string
      description: Non-secret environment variables
    secrets:
      type: array
      items:
        type: string
      description: Secret names (values stored separately)
    mcp_servers:
      type: array
      items:
        type: string
      description: Default MCP servers for project agents
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    version:
      type: integer
      minimum: 1
    metadata:
      type: object
      additionalProperties: true
  stored-in:
  - datastore.database.config-storage
  x-aggregate-root: true
