      - timestamp
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REQUEST_CHANGES
          - ESCALATE
        comment:
          type: string
        issues:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
