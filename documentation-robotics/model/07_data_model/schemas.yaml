        iteration_number:
          type: integer
        maker_output:
          type: string
        maker_execution_id:
          type: string
        reviewer_feedback:
          $ref: '#/definitions/review-feedback'
        reviewer_execution_id:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    review-feedback:
      type: object
      required:
      - decision
