Development Teams:
  id: motivation.stakeholder.development-teams
  name: Development Teams
  type: stakeholder
  documentation: Software development teams who use the Codetoreum platform to automate
    their development workflows, create AI agents, and manage work items. They benefit
    from reduced manual effort and improved code quality.
  stakeholderType: internal
  properties:
    stakeholder.influence: high
    stakeholder.interest: high
Platform Operators:
  id: motivation.stakeholder.platform-operators
  name: Platform Operators
  type: stakeholder
  documentation: DevOps and infrastructure team members responsible for deploying,
    configuring, monitoring, and maintaining the Codetoreum platform in production
    environments.
  stakeholderType: internal
  properties:
    stakeholder.influence: high
    stakeholder.interest: high
AI Researchers and Engineers:
  id: motivation.stakeholder.ai-researchers
  name: AI Researchers and Engineers
  type: stakeholder
  documentation: AI and ML specialists who extend the platform with new agent capabilities,
    fine-tune prompts, and develop new LLM integrations to improve automation quality.
  stakeholderType: internal
  properties:
    stakeholder.influence: medium
    stakeholder.interest: high
Technical Leadership:
  id: motivation.stakeholder.technical-leadership
  name: Technical Leadership
  type: stakeholder
  documentation: Engineering managers and architects who make strategic decisions
    about platform adoption, architecture evolution, and integration with existing
    development infrastructure.
  stakeholderType: internal
  properties:
    stakeholder.influence: high
    stakeholder.interest: medium
Product Management:
  id: motivation.stakeholder.product-management
  name: Product Management
  type: stakeholder
  documentation: Product managers who define requirements for workflow automation,
    prioritize features, and measure the business impact of development efficiency
    improvements.
  stakeholderType: internal
  properties:
    stakeholder.influence: high
    stakeholder.interest: medium
LLM Providers:
  id: motivation.stakeholder.llm-providers
  name: LLM Providers
  type: stakeholder
  documentation: External providers of large language model services (e.g., Anthropic,
    OpenAI) whose APIs power the AI agent capabilities in the platform.
  stakeholderType: partner
  properties:
    stakeholder.influence: medium
    stakeholder.interest: medium
Code Hosting Platforms:
  id: motivation.stakeholder.code-hosting-platforms
  name: Code Hosting Platforms
  type: stakeholder
  documentation: External code hosting and project management platforms (e.g., GitHub)
    that integrate with Codetoreum for work item synchronization and code repository
    access.
  stakeholderType: partner
  properties:
    stakeholder.influence: medium
    stakeholder.interest: low
Security Team:
  id: motivation.stakeholder.security-team
  name: Security Team
  type: stakeholder
  documentation: Information security professionals responsible for ensuring the platform
    meets security standards, agent isolation is properly implemented, and sensitive
    data is protected.
  stakeholderType: internal
  properties:
    stakeholder.influence: high
    stakeholder.interest: high
