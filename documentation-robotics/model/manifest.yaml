  from: 0.1.0
  to: 0.2.0
- changes:
  - Populated motivation layer with goals, stakeholders, requirements, constraints,
    and principles
  - Added cross-layer references (supportsGoals) to business services
  - Added cross-layer references (realizes, supportsGoals) to application services
  - Added platform-observability business service
  - Added event-processor application service
  - Established traceability from motivation through business to application layers
  date: '2025-12-05T16:30:00.000000Z'
  from: 0.2.0
  to: 0.2.1
- changes:
  - Replaced PostgreSQL datastore with Elasticsearch event store and configuration
    storage
  - Added Redis cache and pub/sub for real-time messaging
  - Expanded data model from 10 to 20 schemas
  - Added new schemas - project-context, workflow-template, user, api-key, auth-context,
    comment, workspace-context, execution-result, execution-context, stage-template
  - Enhanced existing schemas with complete field definitions from implementation
  - Added cross-layer stored-in references between schemas and datastores
  - Added x-aggregate-root, x-entity, x-value-object markers to schemas
  - Documented Elasticsearch indices for events, projects, agents, pipelines, workflows,
    config-history
  - Documented Redis key patterns for config cache, sessions, execution state, rate
    limiting
  - Documented Redis pub/sub channels for websocket events, control, config invalidation
  date: '2025-12-05T20:30:00.000000Z'
  from: 0.2.1
  to: 0.2.2
- changes:
  - Populated Security layer with 22 elements derived from codebase analysis
  - Authentication schemes - JWT, httpOnly cookie, bearer header, query param, WebSocket
  - Authorization policies - single-tenant access, API endpoint protection
  - Security controls - rate limiting, circuit breaker, container isolation, audit
    logging
  - Data protection - secret management, session security, frontend auth state
  - Threat mitigations - XSS prevention, CSRF prevention, token theft prevention
  - Populated UX layer with 28 elements from React frontend analysis
  - Screens - auth-required, dashboard, project-config, workflow-config, agent-config,
    history
  - Components - navigation menu, work item list, execution list, real-time events,
    forms
  - State stores - auth store (Zustand), websocket store (Zustand singleton)
  - Hooks - useAuth, useWebSocket
  - Interactions - authenticate, view-dashboard, manage-env-vars, subscribe-events
  - Populated Navigation layer with 17 elements
  - Routes - root, config, workflows, agents, history, catch-all
  - User flows - authentication, onboarding, monitoring, configuration-change
  - State machines - work-item, execution, websocket-connection, authentication
  - Guards - auth guard, error boundary guard
  - Deep linking patterns
  - Added cross-layer references to motivation.goal.security, .observability, .ease-of-configuration
  - Linked security authentication schemes to application.service.authentication-service
  - Linked UX screens to API operations and security authentication schemes
